/* ===== Modo apresentação (tela cheia, só a ilha do cliente) ===== */
body.apresentando{overflow:hidden}
/* apresentação: nada do painel aparece (nem a lista de empresas da barra lateral), e a tela ocupa tudo */
body.apresentando .lado,body.apresentando .lado-fundo,body.apresentando .barra-movel{display:none!important}
body.apresentando .miolo{transform:none!important;animation:none!important}
body.apresentando .esc-comando,body.apresentando .esc-fala,body.apresentando .esc-cartao,body.apresentando .esc-dica{display:none!important}
.campo3d.apresentando{position:fixed;inset:0;z-index:5000;height:100dvh;border-radius:0;border:0;box-shadow:none}
.ap-camada{position:absolute;inset:0;z-index:2100;pointer-events:none;display:none}
.ap-camada.ligada{display:block}
.ap-camada button{pointer-events:auto}
.ap-progresso{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.08)}
.ap-progresso i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9681a,#ffb067);box-shadow:0 0 12px #ff8a3d}
.ap-legenda{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(84px,12vh,120px);max-width:min(560px,calc(100% - 32px))}
.ap-legenda.entra .ap-card{animation:apEntra .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes apEntra{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ap-card{display:flex;flex-direction:column;gap:14px;padding:24px 26px;border-radius:20px;background:rgba(8,17,34,.74);border:1px solid rgba(160,190,240,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.45);color:#eef2f8}
.ap-olho{margin:0;font:600 11.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#f3a66a}
.ap-titulo{margin:0;font-family:var(--f-titulo);font-size:clamp(34px,5vw,58px);line-height:1.05;color:#fff}
.ap-titulo.menor{font-size:clamp(26px,3.4vw,38px)}
.ap-sub{margin:0;color:#b8c6dc;font-size:16px;line-height:1.5}
.ap-pe{margin:4px 0 0;color:#8ea2c4;font-size:13px}
.ap-logo{height:46px;width:auto;align-self:flex-start;filter:drop-shadow(0 4px 18px rgba(0,0,0,.4))}
.ap-linha{display:flex;align-items:center;gap:20px}
.ap-linha > div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ap-anel{flex:none}
.ap-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ap-eixos{display:grid;gap:8px}
.ap-eixo{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;align-items:center;gap:10px;font-size:13.5px;color:#c9d6ea}
.ap-trilho{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.ap-trilho i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#d9681a,#ffb067);animation:crescer 1s .3s cubic-bezier(.2,.8,.2,1) both}
.ap-eixo b{font:600 13px var(--f-mono);text-align:right;color:#fff}
.ap-numeros{display:flex;flex-wrap:wrap;gap:8px 22px;padding-top:4px;border-top:1px solid rgba(160,190,240,.14)}
.ap-numeros span{display:flex;flex-direction:column;font-size:12.5px;color:#a9b9d3;padding-top:10px}
.ap-numeros b{font:600 26px var(--f-titulo);color:#fff}
.ap-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ap-cols ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ap-cols li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.4;color:#eef2f8}
.ap-cols li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;transform:rotate(45deg);border-radius:1px}
.ap-cols li.g::before{background:#f0523f;box-shadow:0 0 10px #f0523f}
.ap-cols li.o::before{background:#38bdf8;box-shadow:0 0 10px #38bdf8}
.ap-cols li.mais{color:#8ea2c4;padding-left:0}.ap-cols li.mais::before{display:none}
.ap-rot{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.ap-rot.r{color:#ff8a7a}.ap-rot.o{color:#7fd3ff}
.ap-feito{display:flex;align-items:center;gap:8px;margin:0;color:#5fe0a0;font-weight:600;font-size:14px}
.ap-feito .ic svg{width:16px;height:16px}
.ap-final{align-items:flex-start}
.ap-grande{margin:0;display:flex;align-items:baseline;gap:12px;font-family:var(--f-titulo);line-height:1}
.ap-grande b{font-size:clamp(64px,10vw,112px);color:#5fe0a0;text-shadow:0 0 40px rgba(47,191,113,.45)}
.ap-grande small{font-size:clamp(18px,2.2vw,26px);color:#c9d6ea;font-weight:500}
.ap-fim{display:flex;gap:10px;margin-top:6px}
.ap-botao{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(160,190,240,.3);background:rgba(255,255,255,.06);color:#eef2f8;font-weight:600;cursor:pointer}
.ap-botao.primario{background:#d9681a;border-color:#d9681a;color:#fff}
.ap-controles{position:absolute;left:50%;bottom:clamp(18px,3vh,30px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(8,17,34,.72);border:1px solid rgba(160,190,240,.2);backdrop-filter:blur(12px)}
.ap-controles button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#eef2f8;display:grid;place-items:center;cursor:pointer}
.ap-controles button:hover{background:rgba(255,255,255,.16)}
.ap-controles button[data-ap="ant"] .ic{transform:none}
.ap-controles button.pausado{background:#d9681a}
.ap-controles .ap-sair{width:auto;padding:0 16px;border-radius:999px;font-weight:600;font-size:13px}
.ap-pontos{display:flex;gap:5px;padding:0 6px}
.ap-pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .3s}
.ap-pontos i.feito{background:rgba(243,166,106,.6)}
.ap-pontos i.atual{width:22px;border-radius:999px;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d}
.ap-camada.no-fim .ap-controles button[data-ap="pausa"]{display:none}
@media (max-width:700px){.ap-legenda{left:12px;right:12px;bottom:78px;max-width:none}.ap-card{padding:18px}.ap-eixo{grid-template-columns:110px 1fr 30px;font-size:12.5px}.ap-pontos{display:none}}
/* Texto da comemoração que sobe no campo */
.festa-campo{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 16px;border-radius:14px;background:rgba(10,30,24,.82);border:1px solid rgba(95,224,160,.55);box-shadow:0 0 40px -6px #2fbf71;color:#eafff3;white-space:nowrap;text-align:center}
.festa-campo b{font:600 20px var(--f-titulo);color:#5fe0a0}
.festa-campo small{font-size:12px;color:#bfe8d2;max-width:280px;overflow:hidden;text-overflow:ellipsis}
/* Botão Apresentar no Início (lista das empresas) */
.ch-apresentar{position:relative;pointer-events:auto}
.ch-apresentar summary{list-style:none;cursor:pointer;background:rgba(12,24,46,.7);border-color:rgba(160,190,240,.25);color:#eef2f8;backdrop-filter:blur(10px)}
.ch-apresentar summary::-webkit-details-marker{display:none}
.ch-lista{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;display:flex;flex-direction:column;padding:8px;border-radius:14px;background:rgba(10,21,40,.95);border:1px solid rgba(160,190,240,.25);box-shadow:0 20px 50px rgba(0,0,0,.45);z-index:5}
.ch-lista-tit{padding:6px 10px 8px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#8ea2c4}
.ch-lista a{padding:9px 10px;border-radius:9px;color:#eef2f8;text-decoration:none;font-size:14px}
.ch-lista a small{display:block;font-size:11.5px;color:#8ea2c4;margin-top:1px}
.ch-lista a:hover{background:rgba(255,255,255,.08)}

/* ===== Cano do setor (aba Gargalos) ===== */
.cano{border-radius:16px;padding:16px 18px 14px;background:radial-gradient(120% 140% at 50% 0%,#132a4d 0%,#0a1527 70%);border:1px solid #1d3558;color:#eef2f8;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.cano-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cano-topo .rotulo{color:#8ea2c4}
.cano-resumo{font-size:13px;font-weight:600}
.cano-resumo.trava{color:#ff8a7a}.cano-resumo.livre{color:#5fe0a0}
.cano-palco{position:relative;height:74px}
.cano-palco canvas{display:block;width:100%;height:100%}
.cano-ponta{position:absolute;bottom:-2px;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#6f84a8}
.cano-ponta.e{left:4px}.cano-ponta.s{right:4px}
.cano-rotulos{position:relative;height:40px}
.cano-rot{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;max-width:150px;text-align:center}
.cano-rot b{font-size:12px;font-weight:600;line-height:1.25;color:#dbe4f2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cano-rot i{font:600 10px var(--f-mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase}
.cano-rot.trava i{color:#ff8a7a}.cano-rot.melhora i{color:#f0b429}.cano-rot.livre i{color:#5fe0a0}
@media (max-width:600px){.cano-rot b{display:none}.cano-rotulos{height:18px}}

/* ===== RF Intelligence por voz ===== */
.ia-caixa-rodape{gap:10px}
.ia-rodape-esq,.ia-rodape-dir{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ia-falar{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
.ia-falar input{accent-color:var(--accent)}
.ia-mic{width:40px;padding:0;justify-content:center}
.voz-painel{display:flex;align-items:center;gap:16px;padding:14px 18px;margin:8px 8px 0;border-radius:14px;background:radial-gradient(120% 160% at 0% 50%,#16305a,#0a1527);border:1px solid #1d3558;color:#eef2f8;animation:surgir .25s ease-out}
.voz-painel[hidden]{display:none}
.voz-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.voz-estado{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#f3a66a}
.voz-texto{margin:0;font-size:15px;color:#eef2f8;overflow-wrap:anywhere}
.voz-painel .btn{color:#c9d6ea}
.orbe-botao{border:0;background:none;padding:0;cursor:pointer;flex:none}
/* O orbe: três camadas de luz girando, com cor e ritmo diferentes para cada estado */
.orbe{position:relative;display:block;width:76px;height:76px;border-radius:50%;--c1:#4d8ff0;--c2:#38bdf8;--c3:#9cc4ff;--vel:6s;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,0) 32%),radial-gradient(circle,var(--c2) 0%,var(--c1) 55%,rgba(0,0,0,0) 72%);
  box-shadow:0 0 30px var(--c1),0 0 70px -10px var(--c2),inset 0 0 20px rgba(255,255,255,.35);animation:orbeRespira 2.4s ease-in-out infinite}
.orbe i{position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c3);border-right-color:color-mix(in srgb,var(--c3) 40%,transparent);animation:orbeGira var(--vel) linear infinite;filter:drop-shadow(0 0 6px var(--c3))}
.orbe i:nth-child(2){inset:-12px;animation-duration:calc(var(--vel) * 1.6);animation-direction:reverse;opacity:.7}
.orbe i:nth-child(3){inset:4px;animation-duration:calc(var(--vel) * .7);opacity:.6}
.orbe.pensando{--c1:#d9681a;--c2:#ffb067;--c3:#ffd2a8;--vel:1.4s;animation:orbeRespira 1s ease-in-out infinite}
.orbe.falando{--c1:#1c9e5e;--c2:#5fe0a0;--c3:#bff5d9;--vel:3s}
.orbe.bate{animation:orbeBate .25s ease-out}
@keyframes orbeGira{to{transform:rotate(360deg)}}
@keyframes orbeRespira{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes orbeBate{0%{transform:scale(1.14)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.orbe,.orbe i{animation:none}}

/* ===== Comando de voz (botão fixo e barra) ===== */
.cmd-botao{position:fixed;right:22px;bottom:22px;z-index:4500;width:58px;height:58px;border-radius:50%;border:1px solid rgba(160,190,240,.35);background:radial-gradient(circle at 50% 40%,#1b3560,#0a1527);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 34px rgba(8,16,32,.4)}
.cmd-botao:hover{transform:translateY(-1px)}
.cmd-botao[hidden]{display:none}
.cmd-botao .orbe.mini{width:28px;height:28px;animation-duration:3.2s}
.cmd-botao .orbe.mini i{inset:-4px}
.cmd-botao .orbe.mini i:nth-child(2){inset:-7px}
.cmd-botao.ligado{border-color:#ff8a3d;box-shadow:0 0 0 4px rgba(217,104,26,.25),0 14px 34px rgba(8,16,32,.4)}
.cmd-barra{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:4600;width:min(720px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;animation:cmdEntra .25s cubic-bezier(.2,.8,.2,1)}
.cmd-barra[hidden]{display:none}
@keyframes cmdEntra{from{opacity:0;transform:translate(-50%,14px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
.cmd-caixa{display:flex;align-items:center;gap:16px;padding:14px 16px 14px 18px;border-radius:22px;background:rgba(8,17,34,.86);border:1px solid rgba(160,190,240,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 60px -20px #4d8ff0}
.cmd-caixa .orbe{width:56px;height:56px;flex:none}
.cmd-meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cmd-estado{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#f3a66a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-meio input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:19px;font-family:var(--f-texto);padding:2px 0}
.cmd-meio input::placeholder{color:#7f93b5}
.cmd-fechar{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#c9d6ea;display:grid;place-items:center;cursor:pointer}
.cmd-exemplos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cmd-exemplos button{padding:7px 12px;border-radius:999px;border:1px solid rgba(160,190,240,.25);background:rgba(8,17,34,.72);color:#c9d6ea;font-size:12.5px;cursor:pointer;backdrop-filter:blur(10px)}

/* Sem transição do navegador: a tela nova só aparece suave */

<script>
/* PDF-INICIO ==========================================================
   Montagem do PDF do diagnóstico. Recebe o construtor do jsPDF e os
   dados já prontos em texto, e devolve o documento.
   ==================================================================== */

/* As fontes padrão do PDF só aceitam os acentos do português (Latin-1).
   Esta função troca o resto (aspas curvas, travessão, setas) por equivalentes. */
function limparTextoPDF(valor) {
  return String(valor == null ? '' : valor)
    .replace(/[“”„]/g, '"').replace(/[‘’‚]/g, "'")
    .replace(/[–—]/g, '-').replace(/…/g, '...')
    .replace(/→/g, '->').replace(/≥/g, '>=').replace(/≤/g, '<=').replace(/≈/g, '~')
    .replace(/•/g, '-').replace(/ /g, ' ')
    .replace(/[^\x00-\xFF]/g, '');
}

function montarPDF(JsPDF, R) {
  const doc = new JsPDF({ unit: 'mm', format: 'a4' });
  const LARGURA = 210, ALTURA = 297, MARGEM = 18, UTIL = LARGURA - 2 * MARGEM;
  const LIMITE_BAIXO = ALTURA - MARGEM - 6;
  const COR = {
    navy: [15, 35, 66], laranja: [217, 104, 26], tinta: [14, 26, 44], cinza: [90, 101, 119],
    claro: [169, 183, 206], linha: [225, 229, 235], fundo: [247, 248, 250], branco: [255, 255, 255]
  };
  const T = limparTextoPDF;
  let y = 0;
  const texto = (c) => doc.setTextColor(c[0], c[1], c[2]);
  const preencher = (c) => doc.setFillColor(c[0], c[1], c[2]);
  const tracar = (c) => doc.setDrawColor(c[0], c[1], c[2]);
  const fonte = (familia, estilo, tamanho) => { doc.setFont(familia, estilo); doc.setFontSize(tamanho); };
  const alturaLinha = (tamanho) => tamanho * 0.3528 * 1.45;
  function novaPagina() { doc.addPage(); y = MARGEM + 10; }
  function garantir(altura) { if (y + altura > LIMITE_BAIXO) novaPagina(); }
  function paragrafo(conteudo, opcoes) {
    const o = Object.assign({ tamanho: 10, estilo: 'normal', familia: 'helvetica', cor: COR.tinta, x: MARGEM, largura: UTIL }, opcoes || {});
    const alt = alturaLinha(o.tamanho);
    T(conteudo).split(/\n+/).forEach((bloco, i, todos) => {
      doc.setFontSize(o.tamanho); doc.setFont(o.familia, o.estilo);
      doc.splitTextToSize(bloco, o.largura).forEach((l) => { garantir(alt); fonte(o.familia, o.estilo, o.tamanho); texto(o.cor); doc.text(l, o.x, y); y += alt; });
      if (i < todos.length - 1) y += alt * 0.4;
    });
  }
  function titulo(etiqueta, nome, subtitulo) {
    garantir(30);
    y += 5;
    fonte('helvetica', 'bold', 7.5); texto(COR.laranja); doc.text(T(etiqueta).toUpperCase(), MARGEM, y, { charSpace: 0.7 });
    y += 7;
    fonte('times', 'bold', 17); texto(COR.navy); doc.text(T(nome), MARGEM, y);
    if (subtitulo) { y += 5.5; fonte('helvetica', 'normal', 9.5); texto(COR.cinza); doc.text(T(subtitulo), MARGEM, y); }
    y += 3.5;
    tracar(COR.linha); doc.setLineWidth(0.3); doc.line(MARGEM, y, LARGURA - MARGEM, y);
    y += 7;
  }
  // Torre desenhada com retângulos, no mesmo desenho do topo do sistema
  function torre(x, yTopo, tam, cor) {
    preencher(cor);
    const u = tam / 24;
    [[5, 2.5, 2.6, 2.3], [10.4, 2.5, 3.2, 2.3], [16.4, 2.5, 2.6, 2.3], [5, 4.8, 14, 2.7], [6.7, 7.5, 10.6, 2.1], [8.2, 10.8, 7.6, 5.6], [7, 17.4, 10, 1.6], [4.6, 19.9, 14.8, 1.6]]
      .forEach(([a, b, c, d]) => doc.rect(x + a * u, yTopo + b * u, c * u, d * u, 'F'));
  }
  const estiloTabela = {
    theme: 'plain',
    margin: { left: MARGEM, right: MARGEM, top: MARGEM + 10, bottom: MARGEM + 6 },
    styles: { font: 'helvetica', fontSize: 9, textColor: COR.tinta, cellPadding: { top: 2.4, bottom: 2.4, left: 3, right: 3 }, lineColor: COR.linha, lineWidth: { bottom: 0.2 }, overflow: 'linebreak' },
    headStyles: { fillColor: COR.navy, textColor: COR.branco, fontStyle: 'bold', fontSize: 8.2, lineWidth: 0 }
  };

  /* ---------- Capa ---------- */
  preencher(COR.navy); doc.rect(0, 0, LARGURA, 64, 'F');
  preencher(COR.laranja); doc.rect(0, 64, LARGURA, 1.4, 'F');
  torre(MARGEM, 13, 11, COR.laranja);
  fonte('helvetica', 'bold', 9.5); texto(COR.branco); doc.text('REAL FORTE', MARGEM + 15, 18.5, { charSpace: 1.6 });
  fonte('helvetica', 'normal', 8); texto(COR.claro); doc.text(T('Consultoria Empresarial desde 1982'), MARGEM + 15, 23);
  fonte('helvetica', 'normal', 8.5); texto(COR.claro); doc.text([T(R.dataTexto), T(R.etapaTexto)], LARGURA - MARGEM, 18.5, { align: 'right' });
  fonte('times', 'bold', 27); texto(COR.branco); doc.text('Diagnóstico Operacional', MARGEM, 44);
  fonte('helvetica', 'bold', 13); texto(COR.laranja); doc.text(T(R.empresa.nome), MARGEM, 54);
  y = 77;

  const colunas = [['Segmento', R.empresa.segmento], ['Cidade', R.empresa.cidade], ['Contato', R.empresa.contato], ['Consultor', R.consultor]];
  const larguraColuna = UTIL / 4;
  let maior = 0;
  colunas.forEach(([rotulo, valor], i) => {
    const x = MARGEM + i * larguraColuna;
    fonte('helvetica', 'bold', 7); texto(COR.cinza); doc.text(T(rotulo).toUpperCase(), x, y, { charSpace: 0.5 });
    fonte('helvetica', 'normal', 9.5); texto(COR.tinta);
    const linhas = doc.splitTextToSize(T(valor || '-'), larguraColuna - 5);
    doc.text(linhas, x, y + 5);
    maior = Math.max(maior, 5 + linhas.length * alturaLinha(9.5));
  });
  y += maior + 7;

  // Três números
  const caixas = [['Setores visitados', R.numeros.setores], ['Gargalos encontrados', R.numeros.gargalos], ['Propostas prontas', R.numeros.propostas]];
  const vao = 5, larguraCaixa = (UTIL - 2 * vao) / 3, alturaCaixa = 22;
  caixas.forEach(([rotulo, valor], i) => {
    const x = MARGEM + i * (larguraCaixa + vao);
    preencher(COR.fundo); doc.rect(x, y, larguraCaixa, alturaCaixa, 'F');
    preencher(i === 2 ? COR.laranja : COR.navy); doc.rect(x, y, 1.2, alturaCaixa, 'F');
    fonte('helvetica', 'bold', 7); texto(COR.cinza); doc.text(T(rotulo).toUpperCase(), x + 5, y + 7, { charSpace: 0.4 });
    fonte('times', 'bold', 20); texto(COR.navy); doc.text(String(valor), x + 5, y + 17);
  });
  y += alturaCaixa + 4;

  // Visão geral por setor
  if (R.setores.length) {
    titulo('Visão geral', 'Gargalos por setor');
    doc.autoTable(Object.assign({}, estiloTabela, {
      startY: y,
      head: [['Setor', 'Responsável', 'Gargalos', 'Com proposta', 'Principal gargalo']],
      body: R.setores.map((s) => [T(s.nome), T(s.responsavel || '-'), String(s.gargalos.length), String(s.gargalos.filter((g) => g.proposta).length), T((s.gargalos[0] || {}).titulo || '-')]),
      columnStyles: { 0: { fontStyle: 'bold', cellWidth: 30 }, 2: { halign: 'right', cellWidth: 19 }, 3: { halign: 'right', cellWidth: 24 } }
    }));
    y = doc.lastAutoTable.finalY + 6;
  }

  /* ---------- Um bloco por setor ---------- */
  R.setores.forEach((s) => {
    novaPagina();
    titulo('Setor', s.nome, s.responsavel ? 'Responsável: ' + s.responsavel : '');
    if (s.notas.length) {
      fonte('helvetica', 'bold', 7.5); texto(COR.cinza); doc.text('O QUE EU OBSERVEI', MARGEM, y, { charSpace: 0.6 }); y += 5.5;
      s.notas.forEach((n) => {
        garantir(12);
        fonte('helvetica', 'bold', 8.5); texto(COR.navy); doc.text(T(n.data), MARGEM, y); y += alturaLinha(8.5);
        paragrafo(n.texto, { tamanho: 9.6, cor: COR.tinta });
        y += 3;
      });
      y += 2;
    }
    if (s.gargalos.length) {
      garantir(14);
      fonte('helvetica', 'bold', 7.5); texto(COR.cinza); doc.text('GARGALOS E PROPOSTAS', MARGEM, y, { charSpace: 0.6 }); y += 4;
      s.gargalos.forEach((g, i) => {
        garantir(30);
        doc.autoTable(Object.assign({}, estiloTabela, {
          startY: y,
          head: [[{ content: T((i + 1) + '. ' + g.titulo), colSpan: 2, styles: { fontSize: 9.5 } }]],
          body: [['Situação', g.situacao], ['O que eu observei', g.observacao || '-'], ['O que vou propor', g.proposta || 'Ainda sem proposta']].map(([a, b]) => [T(a), T(b)]),
          columnStyles: { 0: { cellWidth: 38, fontStyle: 'bold', textColor: COR.cinza, fontSize: 8.2 } },
          rowPageBreak: 'avoid'
        }));
        y = doc.lastAutoTable.finalY + 5;
      });
    } else {
      paragrafo('Nenhum gargalo registrado neste setor.', { estilo: 'italic', cor: COR.cinza });
    }
  });

  /* ---------- Assinaturas ---------- */
  garantir(42);
  y += 10;
  fonte('helvetica', 'bold', 9); texto(COR.navy); doc.text('Revisão e aprovação', MARGEM, y);
  y += 18;
  tracar(COR.cinza); doc.setLineWidth(0.3);
  const meia = (UTIL - 12) / 2;
  doc.line(MARGEM, y, MARGEM + meia, y);
  doc.line(MARGEM + meia + 12, y, LARGURA - MARGEM, y);
  fonte('helvetica', 'normal', 8.5); texto(COR.cinza);
  doc.text(T('Consultor: ' + (R.consultor || '')), MARGEM, y + 5);
  doc.text('Sócio da Real Forte', MARGEM + meia + 12, y + 5);

  /* ---------- Cabeçalho e rodapé ---------- */
  const total = doc.getNumberOfPages();
  for (let i = 1; i <= total; i++) {
    doc.setPage(i);
    tracar(COR.linha); doc.setLineWidth(0.2); doc.line(MARGEM, ALTURA - 13, LARGURA - MARGEM, ALTURA - 13);
    fonte('helvetica', 'normal', 7.5); texto(COR.cinza);
    doc.text(T(R.frente), MARGEM, ALTURA - 8.5);
    doc.text('Página ' + i + ' de ' + total, LARGURA - MARGEM, ALTURA - 8.5, { align: 'right' });
    if (i > 1) {
      torre(MARGEM, 8.2, 5, COR.laranja);
      fonte('helvetica', 'bold', 7.5); texto(COR.navy); doc.text('REAL FORTE', MARGEM + 7, 12, { charSpace: 1.1 });
      fonte('helvetica', 'normal', 7.5); texto(COR.cinza); doc.text(T('Diagnóstico Operacional · ' + R.empresa.nome), LARGURA - MARGEM, 12, { align: 'right' });
      tracar(COR.linha); doc.setLineWidth(0.2); doc.line(MARGEM, 15, LARGURA - MARGEM, 15);
    }
  }
  return doc;
}

/* PDF-FIM */

/* PPT-INICIO ==========================================================
   PowerPoint da proposta de um gargalo, no formato de demo:
   capa, a situação hoje, como vai funcionar, o que muda, hoje e com a
   melhoria, próximo passo. A = dados prontos (ver dadosApresentacao).
   ==================================================================== */
function montarPPT(PptxGenJS, A) {
  const pptx = new PptxGenJS();
  pptx.layout = 'LAYOUT_WIDE';   // 13,33 × 7,5 polegadas
  pptx.author = A.consultor || 'Real Forte Consultoria';
  pptx.company = 'Real Forte Consultoria';
  pptx.title = A.c.titulo;
  const COR = {
    navy: '0F2342', laranja: 'D9681A', laranjaClaro: 'F3A66A', tinta: '0E1A2C', cinza: '5A6577', claro: 'A9B7CE',
    linha: 'E1E5EB', fundo: 'F7F8FA', branco: 'FFFFFF', verde: '1C7F52', verdeClaro: 'E3F2EA', vermelho: 'B9362C', vermelhoClaro: 'FBE9E6'
  };
  const TITULO = 'Georgia', TEXTO = 'Arial';
  const W = 13.333, H = 7.5, M = 0.75;
  const F = pptx.ShapeType;
  let numero = 0;
  const forma = (s, tipo, x, y, w, h, cor, extra) => s.addShape(tipo, Object.assign({ x, y, w, h, fill: { color: cor }, line: { color: cor, width: 0.5 } }, extra || {}));

  // O PowerPoint não diminui a letra sozinho ao abrir o arquivo. Então a conta é feita aqui:
  // a letra desce até o texto caber na caixa; se nem no tamanho mínimo couber, o texto é cortado
  // numa palavra inteira e ganha "…". Nenhum texto sai da caixa.
  function caber(texto, w, h, max, min, larguraLetra) {
    const limpo = String(texto || '').replace(/\s+/g, ' ').trim();
    const linhasDe = (t, pt) => {
      const porLinha = Math.max(1, Math.floor((w * 72) / (pt * larguraLetra)));
      let linhas = 1, atual = 0;
      t.split(' ').forEach((p) => { const n = p.length; if (atual && atual + 1 + n > porLinha) { linhas++; atual = n; } else atual += (atual ? 1 : 0) + n; });
      return linhas;
    };
    const cabe = (t, pt) => linhasDe(t, pt) * pt * 1.22 / 72 <= h;
    for (let pt = max; pt >= min; pt--) if (cabe(limpo, pt)) return { texto: limpo, pt };
    const palavras = limpo.split(' ');
    while (palavras.length > 1 && !cabe(palavras.join(' ') + '…', min)) palavras.pop();
    return { texto: palavras.join(' ').replace(/[\s,;:.]+$/, '') + '…', pt: min };
  }
  const textoEm = (s, conteudo, x, y, w, h, op) => {
    const o = Object.assign({ fontFace: TEXTO }, op);
    const larg = (o.fontFace === TITULO ? 0.56 : 0.5) + (o.bold ? 0.04 : 0) + (o.charSpacing ? o.charSpacing / 20 : 0);
    const max = o.fontSize || 14; const min = o.minimo || Math.max(10, Math.round(max * 0.62));
    const r = caber(conteudo, w, h, max, min, larg);
    delete o.minimo;
    s.addText(r.texto, Object.assign({ x, y, w, h, margin: 0, valign: 'top' }, o, { fontSize: r.pt }));
  };
  const logo = (s, versao, x, y, alt) => { if (A.logo && A.logo[versao]) s.addImage({ data: A.logo[versao], x, y, w: alt * A.logo.proporcao, h: alt }); };

  function slideClaro(etiqueta, titulo) {
    const s = pptx.addSlide(); numero++;
    s.background = { color: COR.fundo };
    forma(s, F.rect, 0, 0, 0.14, H, COR.laranja);
    logo(s, 'escuro', M, 0.36, 0.46);
    textoEm(s, A.setor + ' · ' + A.empresa, W - M - 6, 0.48, 6, 0.3, { fontSize: 11, color: COR.cinza, align: 'right' });
    textoEm(s, etiqueta.toUpperCase(), M, 1.2, W - 2 * M, 0.32, { fontSize: 12, bold: true, color: COR.laranja, charSpacing: 3 });
    textoEm(s, titulo, M, 1.58, W - 2 * M, 1.0, { fontFace: TITULO, fontSize: 30, minimo: 22, bold: true, color: COR.navy });
    textoEm(s, String(numero), W - M - 0.6, H - 0.55, 0.6, 0.3, { fontSize: 10, color: COR.cinza, align: 'right' });
    return s;
  }
  function slideEscuro() {
    const s = pptx.addSlide(); numero++;
    s.background = { color: COR.navy };
    forma(s, F.rect, 0, H - 0.16, W, 0.16, COR.laranja);
    return s;
  }

  // 1. Capa
  {
    const s = slideEscuro();
    logo(s, 'claro', M, 0.7, 0.9);
    textoEm(s, 'PROPOSTA DE MELHORIA', M, 2.6, 8, 0.36, { fontSize: 14, bold: true, color: COR.laranja, charSpacing: 4 });
    textoEm(s, A.c.titulo, M, 3.05, W - 2 * M, 1.75, { fontFace: TITULO, fontSize: 46, minimo: 30, bold: true, color: COR.branco });
    textoEm(s, 'Para o setor ' + A.setor + ' · ' + A.empresa, M, 5.0, W - 2 * M, 0.45, { fontSize: 20, color: COR.laranjaClaro });
    textoEm(s, [A.data, A.consultor].filter(Boolean).join(' · '), M, 6.55, 9, 0.35, { fontSize: 12, color: COR.claro });
  }

  // 2. A situação hoje (a dor)
  {
    const s = slideClaro(A.oportunidade ? 'O que o setor pediu' : 'A situação hoje', A.c.frase_dor);
    const itens = A.c.dores.slice(0, 3);
    const n = Math.max(1, itens.length), vao = 0.35, w = (W - 2 * M - vao * (n - 1)) / n;
    itens.forEach((t, i) => {
      const x = M + i * (w + vao);
      forma(s, F.roundRect, x, 3.0, w, 3.35, COR.vermelhoClaro, { rectRadius: 0.12 });
      forma(s, F.ellipse, x + 0.35, 3.35, 0.6, 0.6, COR.vermelho);
      textoEm(s, String(i + 1), x + 0.35, 3.35, 0.6, 0.6, { fontSize: 18, bold: true, color: COR.branco, align: 'center', valign: 'middle' });
      textoEm(s, t, x + 0.35, 4.2, w - 0.7, 1.9, { fontSize: n === 1 ? 24 : 19, minimo: 13, color: COR.tinta });
    });
  }

  // 3. Como vai funcionar (passo a passo)
  {
    const s = slideClaro('Como vai funcionar', A.c.frase_melhoria);
    const passos = A.c.passos.slice(0, 3);
    const n = Math.max(1, passos.length), seta = 0.5, w = (W - 2 * M - seta * (n - 1)) / n;
    const cores = [COR.navy, COR.laranja, COR.verde];
    passos.forEach((p, i) => {
      const x = M + i * (w + seta);
      s.addShape(F.roundRect, { x, y: 3.0, w, h: 3.4, fill: { color: COR.branco }, line: { color: COR.linha, width: 1 }, rectRadius: 0.12 });
      forma(s, F.ellipse, x + 0.35, 3.35, 0.76, 0.76, cores[i % 3]);
      textoEm(s, String(i + 1), x + 0.35, 3.35, 0.76, 0.76, { fontSize: 22, bold: true, color: COR.branco, align: 'center', valign: 'middle' });
      if (p.titulo) {
        textoEm(s, p.titulo, x + 0.35, 4.3, w - 0.7, 0.7, { fontFace: TITULO, fontSize: 19, minimo: 14, bold: true, color: COR.navy });
        textoEm(s, p.texto, x + 0.35, 5.1, w - 0.7, 1.1, { fontSize: 15, minimo: 11, color: COR.cinza });
      } else textoEm(s, p.texto, x + 0.35, 4.3, w - 0.7, 1.9, { fontSize: 17, minimo: 12, color: COR.tinta });
      if (i < n - 1) forma(s, F.rightArrow, x + w + 0.1, 4.48, 0.3, 0.4, COR.laranja);
    });
  }

  // 4. O que muda no dia a dia
  if (A.c.deixa_de_fazer.length || A.c.ganha.length) {
    const s = slideClaro('No dia a dia', 'O que muda para o setor');
    const colunas = [['Vocês deixam de', A.c.deixa_de_fazer, COR.vermelho, COR.vermelhoClaro], ['Vocês ganham', A.c.ganha, COR.verde, COR.verdeClaro]].filter((c) => c[1].length);
    const vao = 0.4, w = (W - 2 * M - vao * (colunas.length - 1)) / colunas.length;
    colunas.forEach(([rotulo, itens, cor, claro], i) => {
      const x = M + i * (w + vao);
      forma(s, F.roundRect, x, 2.85, w, 3.8, claro, { rectRadius: 0.12 });
      textoEm(s, rotulo.toUpperCase(), x + 0.4, 3.1, w - 0.8, 0.36, { fontSize: 13, bold: true, color: cor, charSpacing: 2 });
      itens.slice(0, 4).forEach((t, j) => {
        const yy = 3.65 + j * 0.72;
        forma(s, F.rect, x + 0.4, yy + 0.1, 0.15, 0.15, cor);
        textoEm(s, t, x + 0.75, yy, w - 1.15, 0.62, { fontSize: 17, minimo: 12, color: COR.tinta });
      });
    });
  }

  // 5. Hoje e com a melhoria, lado a lado
  if (A.c.comparacao.length) {
    const s = slideClaro('Lado a lado', 'Hoje e com a melhoria');
    const linhas = A.c.comparacao.slice(0, 3);
    const larg = (W - 2 * M - 0.8) / 2, xA = M, xB = M + larg + 0.8;
    textoEm(s, 'HOJE', xA, 2.75, larg, 0.32, { fontSize: 13, bold: true, color: COR.vermelho, charSpacing: 3 });
    textoEm(s, 'COM A MELHORIA', xB, 2.75, larg, 0.32, { fontSize: 13, bold: true, color: COR.verde, charSpacing: 3 });
    const alt = Math.min(1.6, 3.6 / linhas.length - 0.18);
    linhas.forEach((l, i) => {
      const yy = 3.2 + i * (alt + 0.18);
      forma(s, F.roundRect, xA, yy, larg, alt, COR.vermelhoClaro, { rectRadius: 0.1 });
      textoEm(s, l.hoje, xA + 0.3, yy + 0.15, larg - 0.6, alt - 0.3, { fontSize: 17, minimo: 12, color: COR.tinta, valign: 'middle' });
      forma(s, F.rightArrow, xA + larg + 0.2, yy + alt / 2 - 0.18, 0.4, 0.36, COR.laranja);
      forma(s, F.roundRect, xB, yy, larg, alt, COR.verdeClaro, { rectRadius: 0.1 });
      textoEm(s, l.depois, xB + 0.3, yy + 0.15, larg - 0.6, alt - 0.3, { fontSize: 17, minimo: 12, color: COR.tinta, valign: 'middle' });
    });
  }

  // 6. Próximo passo
  {
    const s = slideEscuro();
    logo(s, 'claro', M, 0.55, 0.6);
    textoEm(s, 'PRÓXIMO PASSO', M, 1.7, 8, 0.36, { fontSize: 14, bold: true, color: COR.laranja, charSpacing: 4 });
    textoEm(s, A.c.pedido, M, 2.15, W - 2 * M, 1.3, { fontFace: TITULO, fontSize: 36, minimo: 26, bold: true, color: COR.branco });
    if (A.c.precisamos.length) {

  return pptx;
}

/* =====================================================================
   REALFORT SQUAD — o escritório dos agentes de IA (tela Início), em jeito de desenho animado

   O que aparece:
   - NA FRENTE: as sete mini salas dos agentes (Builder, Report, Sherlock, Fix, Scout, Data, Pixel),
     cada uma com a cara da função. A frente é aberta: dá para ver o robô trabalhando.
   - NO MEIO: a Central Atlas, com o telão que mostra o pedido da vez e quem foi chamado.
   - DOS LADOS: o lounge e o quiosque de café (onde o time descansa).
   - NO FUNDO: as casinhas das salas da empresa escolhida, uma por setor do painel, mais a Sala de
     reunião. A tela de cada sala mostra os números de verdade do setor.
   - Os robôs flutuam pela praça. Quando você fala (ou escreve) com o Atlas, todos param e olham
     para você. O Atlas escolhe quem resolve; o escolhido vai para a mini sala e põe o fone.
     Enquanto as ferramentas não estão ligadas, ele avisa que o pedido ficou anotado: nada é inventado.

   Arquivos desta parte (src/escritorio/, juntados em ordem pelo montar.py):
   00-simbolo   símbolo da Real Forte (imagem)
   01-base      estado, cores, agentes, tipos de sala, materiais e peças básicas
   02-texturas  tudo o que é desenhado em canvas (telas, placas, céu, balões)
   03-cenario   salão, Central Atlas, mini salas, lounge, café e as casinhas da empresa
   04-robos     o corpo de cada agente, o rosto digital, o fone e o propulsor
   05-vida      mapa de pisar, caminhos, rotinas livres, pedidos ao Atlas e animações
   06-camera    câmera, cliques, cartão do robô
   07-cinema    renderizador, reflexos, brilho das luzes, laço de quadros e a ligação com o painel

   Usa a biblioteca Three.js (carregada no topo da página). Sem ela, ou se o aparelho não tiver
   3D, a tela Início mostra os cartões de sempre. Nada aqui grava dados: o escritório só lê o painel.
   ===================================================================== */

function campoDisponivel() {
  if (CAMPO.disponivel != null) return CAMPO.disponivel;
  try {
    const c = document.createElement('canvas');
    CAMPO.disponivel = !!(window.THREE && window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (x) { CAMPO.disponivel = false; }
  return CAMPO.disponivel;
}

/* A logo é clara (feita para fundo escuro)? Mede o brilho médio dos pontos que aparecem (não
   transparentes). Logo clara vai em cartão azul-marinho; logo escura, em cartão branco.
   Também usada no PDF do relatório. */
function logoEhClara(img) {
  try {
    const c = document.createElement('canvas'); c.width = c.height = 48; const q = c.getContext('2d'); q.drawImage(img, 0, 0, 48, 48);
    const d = q.getImageData(0, 0, 48, 48).data; let soma = 0, n = 0;
    for (let i = 0; i < d.length; i += 4) { if (d[i + 3] < 128) continue; soma += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; n++; }
    if (n < 40) return false;
    // logo sem transparência (fundo pintado): olha só a borda para saber a cor do fundo
    const cheia = n > 48 * 48 * 0.9;
    if (cheia) { let b = 0, nb = 0; for (let k = 0; k < 48; k++) [[k, 0], [k, 47], [0, k], [47, k]].forEach(([x, y]) => { const i = (y * 48 + x) * 4; b += (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255; nb++; }); return b / nb < 0.35 ? 'fundoEscuro' : false; }
    return soma / n > 0.72;
  } catch (x) { return false; }
}

/* ---------- Peças básicas ---------- */
const GEO = {};
function geometrias() {
  const T = THREE;

  GEO.cil = new T.CylinderGeometry(1, 1, 1, 28).translate(0, 0.5, 0);
  GEO.cil12 = new T.CylinderGeometry(1, 1, 1, 12).translate(0, 0.5, 0);
  GEO.cilX = new T.CylinderGeometry(1, 1, 1, 28).rotateZ(Math.PI / 2);    // deitado no eixo x, centrado (fone, rodinha)
  GEO.esfera = new T.SphereGeometry(1, 22, 14);
  GEO.esferaFina = new T.SphereGeometry(1, 40, 28);   // só para as cabeças dos robôs
  GEO.plano = new T.PlaneGeometry(1, 1);
  GEO.chao = new T.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  GEO.toro = new T.TorusGeometry(1, 0.04, 10, 72).rotateX(Math.PI / 2);   // anel deitado, tubo fino

// Atalho: cria a peça, posiciona e escala (sempre as três escalas)
function peca(geo, material, x, y, z, sx, sy, sz, pai) {
  const m = new THREE.Mesh(geo, material);

/* Caixa de cantos arredondados (o acabamento que tira a cara de "maquete").
   Faz uma caixa com mais divisões perto das quinas e empurra cada ponto para a superfície arredondada. */
function caixaRedonda(w, h, d, r, s) {
  s = s || 2; r = Math.max(0.001, Math.min(r, w / 2 - 0.001, h / 2 - 0.001, d / 2 - 0.001));
  const chave = ['cr', w, h, d, r, s].map((v) => (typeof v === 'number' ? v.toFixed(4) : v)).join(':');
  if (GEO[chave]) return GEO[chave];

  const P = g.attributes.position, Nn = g.attributes.normal, v = new THREE.Vector3(), dentro = new THREE.Vector3();

  const mapa = (u, H) => { const k = Math.round((u + 0.5) * N); return k <= s ? -H + r * k / s : H - r + r * (k - s - 1) / s; };
  const hx = w / 2 - r, hy = h / 2 - r, hz = d / 2 - r;

    v.set(mapa(P.getX(i), w / 2), mapa(P.getY(i), h / 2), mapa(P.getZ(i), d / 2));
    dentro.set(Math.max(-hx, Math.min(hx, v.x)), Math.max(-hy, Math.min(hy, v.y)), Math.max(-hz, Math.min(hz, v.z)));

  }

// Atalho para caixa arredondada já posicionada (base no y dado)
const bloco = (w, h, d, r, material, x, y, z, pai) => peca(caixaRedonda(w, h, d, r), material, x, y, z, 1, 1, 1, pai);
// Perfil girado (corpo dos robôs, vasos, abajur): pontos [raio, altura]
function torneado(pontos, lados) {
  const chave = 'tor:' + JSON.stringify(pontos) + ':' + (lados || 40);
  if (!GEO[chave]) GEO[chave] = new THREE.LatheGeometry(pontos.map(([r, y]) => new THREE.Vector2(Math.max(0.0001, r), y)), lados || 28);
  return GEO[chave];

// Setor de anel (fatia de pizza oca) extrudado: piso das cápsulas, mesa em arco, degraus
function anelSetor(r0, r1, a0, a1, altura, curvas) {
  const chave = ['as', r0, r1, a0, a1, altura, curvas].map((v) => (typeof v === 'number' ? v.toFixed(4) : v)).join(':');
  if (GEO[chave]) return GEO[chave];
  const f = new THREE.Shape(), n = curvas || 48;
  // no plano da forma: x = sen(a)·r, y = -cos(a)·r; girando -90° no x, a forma deita no chão
  // (y da forma vira -z do mundo, então o ângulo a fica medido a partir do +z) e a espessura sobe
  for (let i = 0; i <= n; i++) { const a = a0 + (a1 - a0) * i / n; const p = [Math.sin(a) * r1, -Math.cos(a) * r1]; if (i) f.lineTo(p[0], p[1]); else f.moveTo(p[0], p[1]); }
  for (let i = n; i >= 0; i--) { const a = a0 + (a1 - a0) * i / n; f.lineTo(Math.sin(a) * r0, -Math.cos(a) * r0); }

  const curva = new THREE.CatmullRomCurve3(pontos.map(([x, y, z]) => new THREE.Vector3(x, y, z)), !!fechado, 'centripetal');
  return new THREE.TubeGeometry(curva, Math.max(16, pontos.length * 8), raio, 8, !!fechado);

// Sorteio que se repete igual (a mesma decoração toda vez que o escritório é montado)

const misturar = (a, b, t) => a + (b - a) * t;

   Todas viram "sem índice" e ganham uv zerado se não tiverem. */
function juntarGeometrias(lista) {
  const partes = lista.map((g) => (g.index ? g.toNonIndexed() : g));
  let total = 0; partes.forEach((g) => { total += g.attributes.position.count; });
  const pos = new Float32Array(total * 3), nor = new Float32Array(total * 3), uv = new Float32Array(total * 2);
  let o = 0;
  partes.forEach((g) => {

    pos.set(g.attributes.position.array.subarray(0, n * 3), o * 3);
    if (g.attributes.normal) nor.set(g.attributes.normal.array.subarray(0, n * 3), o * 3);
    if (g.attributes.uv) uv.set(g.attributes.uv.array.subarray(0, n * 2), o * 2);

/* Arco deitado (filete, corrimão, travessa) entre os ângulos a0 e a1, medidos a partir do +z indo para o +x

function arcoDeitado(r, tubo, a0, a1, segs) {
  const chave = ['arco', r, tubo, a0, a1, segs].map((v) => (typeof v === 'number' ? v.toFixed(4) : v)).join(':');
  if (!GEO[chave]) GEO[chave] = new THREE.TorusGeometry(r, tubo, 6, segs || Math.max(16, Math.round((a1 - a0) * r * 4)), a1 - a0).rotateX(Math.PI / 2).rotateY(a1 - Math.PI / 2);

/* =====================================================================

// O símbolo da Real Forte como imagem (carrega rápido: está dentro da página)
const IMG_SIMBOLO = (typeof Image !== 'undefined') ? Object.assign(new Image(), { src: SIMBOLO_RF }) : null;

    q.fillStyle = '#b5afa7'; q.fillRect(0, 0, W, W);

// Selo hexagonal: fundo azul-marinho da Real Forte, borda laranja acesa e o ícone (ou o símbolo da Real Forte)

/* =====================================================================
   ROBÔS — o corpo de cada agente e o rosto digital.
   Todos seguem o mesmo esqueleto (pernas, tronco, ombros, cotovelos, pescoço e cabeça), assim as
   animações servem para todos. O que muda é a forma: cada um tem corpo, cabeça e acessórios próprios.
   Esqueleto (de baixo para cima):
     g (pé no chão, virado para +z) → corpo → quadril → pernas (E, D) e tronco → ombros (E, D) → cotovelos
                                                                         → pescoço → cabeça
   O rosto é um canvas pequeno (olhos acesos) aplicado no visor; muda só quando a expressão muda.
   ===================================================================== */

const COR_OLHO = '#62ecff';
// Desenha os olhos no canvas do visor. dx/dy: para onde olha (-1 a 1). expr: normal, feliz, foco, ouvindo, duvida, preocupado, piscar
function desenharOlhos(q, W, H, expr, dx, dy, cor) {
  q.fillStyle = '#000'; q.fillRect(0, 0, W, H);
  const cx = W / 2 + dx * W * 0.07, cy = H * 0.5 + dy * H * 0.1, sep = W * 0.15, c = cor || COR_OLHO;
  q.save(); q.shadowColor = c; q.shadowBlur = W * 0.04; q.fillStyle = c; q.strokeStyle = c; q.lineCap = 'round'; q.lineWidth = W * 0.035;
  const pilula = (x, y, w, h) => { retanguloRedondo(q, x - w / 2, y - h / 2, w, h, Math.min(w, h) / 2); q.fill(); };
  [-1, 1].forEach((k) => {
    const x = cx + k * sep;
    if (expr === 'piscar') { q.beginPath(); q.moveTo(x - W * 0.04, cy); q.lineTo(x + W * 0.04, cy); q.stroke(); }

<script>

/* =====================================================================

   - as estrelas se agrupam em constelações pelo tipo de setor (Logística, Comercial...);

// Câmera: gira em volta do centro escolhido; arrastar gira, rolar aproxima
const GCAM = { theta: 0.3, phi: 1.15, raio: 70, raioAlvo: 70, alvo: null, alvoDestino: null, vTheta: 0, parada: 0 };
function ligarControlesGalaxia(tela) {

// Monta as estrelas a partir da biblioteca (só refaz quando a biblioteca muda)
function montarEstrelas(itens) {
  const T = THREE;

// Anel de progresso (porcentagem resolvida)
function anel(pct, tam, traco) {
  tam = tam || 18; traco = traco || 3;
  const r = (tam - traco) / 2, c = 2 * Math.PI * r, meio = tam / 2;
  const valor = pct > 0 ? `<circle class="valor" cx="${meio}" cy="${meio}" r="${r}" fill="none" stroke-width="${traco}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c * (1 - Math.min(pct, 100) / 100)).toFixed(2)}" transform="rotate(-90 ${meio} ${meio})"/>` : '';
  return `<svg class="anel" width="${tam}" height="${tam}" viewBox="0 0 ${tam} ${tam}" aria-hidden="true"><circle class="trilho" cx="${meio}" cy="${meio}" r="${r}" fill="none" stroke-width="${traco}"/>${valor}</svg>`;
}
const anelRotulo = (pct, tam) => `<span class="anel-rotulo" title="${pct}% resolvido">${anel(pct, tam, 4)}<span>${pct}%</span></span>`;

let temporizadorToast = null, elToast = null;
const TEM_POPOVER = typeof HTMLElement !== 'undefined' && HTMLElement.prototype.hasOwnProperty('popover');
// O aviso mora dentro do painel aberto de cima (senão o painel o cobre e o botão Desfazer não responde)
function lugarDoToast() { return ['dlg'].map((id) => document.getElementById(id)).find((d) => d && d.open) || document.body; }
function mostrarToast(el) {
  const lugar = lugarDoToast();
  if (el.parentNode !== lugar) lugar.appendChild(el);
  if (TEM_POPOVER) { try { if (el.matches(':popover-open')) el.hidePopover(); el.showPopover(); } catch (_) { /* segue como aviso comum */ } }
  el.hidden = false;
}
function esconderToast() {
  const el = elToast; if (!el) return;
  el.hidden = true;
  if (TEM_POPOVER) { try { el.hidePopover(); } catch (_) { /* já estava fechado */ } }
}
// Aviso rápido no rodapé; "acao" opcional vira um botão (ex.: Desfazer)
function toast(mensagem, tipo, acao) {
  if (!elToast) { elToast = document.createElement('div'); elToast.id = 'toast'; elToast.setAttribute('role', 'status'); if (TEM_POPOVER) elToast.popover = 'manual'; }
  const el = elToast;
  el.className = 'toast' + (tipo === 'erro' ? ' erro' : '');
  el.innerHTML = `<span>${esc(mensagem)}</span>${acao ? `<button type="button" id="toast-acao">${esc(acao.rotulo)}</button>` : ''}`;
  mostrarToast(el);
  if (acao) el.querySelector('#toast-acao').onclick = () => { esconderToast(); acao.fn(); };
  clearTimeout(temporizadorToast);
  temporizadorToast = setTimeout(esconderToast, acao ? 6000 : 3800);
}
// Quando um painel fecha com o aviso dentro, o aviso passa para o que ficou aberto
['dlg'].forEach((id) => document.getElementById(id).addEventListener('close', () => {
  const el = elToast;
  if (el && !el.hidden && el.parentNode && el.parentNode.id === id) setTimeout(() => mostrarToast(el), 0);
}));

/* ---------- 4. Consultas ---------- */
const empresaPorId = (id) => S.empresas.find((e) => e.id === id);
const setorPorId = (id) => S.setores.find((s) => s.id === id);
const gargaloPorId = (id) => S.gargalos.find((g) => g.id === id);
const setoresDa = (empresaId) => S.setores.filter((s) => s.empresaId === empresaId).sort((a, b) => String(a.nome).localeCompare(String(b.nome)));
// Gargalo atrapalha o setor. Oportunidade é o "poderia ter" que o setor pede: não atrapalha, mas dá para entregar.
// Os dois ficam na mesma coleção; o campo "tipo" diz qual é (sem "tipo" = gargalo).
const ehOport = (g) => g.tipo === 'oportunidade';
const ordemItens = (a, b) => SITUACOES.indexOf(situacaoDe(a)) - SITUACOES.indexOf(situacaoDe(b)) || String(a.titulo).localeCompare(String(b.titulo));
const itensDa = (empresaId) => S.gargalos.filter((g) => g.empresaId === empresaId);
const itensDo = (setorId) => S.gargalos.filter((g) => g.setorId === setorId).sort(ordemItens);
const oportunidadesDo = (setorId) => itensDo(setorId).filter(ehOport);
const gargalosDa = (empresaId) => itensDa(empresaId).filter((g) => !ehOport(g));
const gargalosDo = (setorId) => itensDo(setorId).filter((g) => !ehOport(g));
const notasDo = (setorId) => S.diario.filter((n) => n.setorId === setorId).sort((a, b) => String(b.data || '').localeCompare(String(a.data || '')));
const empresasOrdenadas = () => [...S.empresas].sort((a, b) => (a.exemplo ? 1 : 0) - (b.exemplo ? 1 : 0) || String(a.nome).localeCompare(String(b.nome)));

/* ---------- 5. Armazenamento ---------- */
function usar(nome) {
  try { return Promise.resolve(window.claude.use(nome)).catch(() => null); }
  catch (_) { return Promise.resolve(null); }
}

// Barra lateral recolhida: lembrada só neste navegador (se o navegador não deixar guardar, abre normal)
function aplicarLadoRecolhido() { document.getElementById('app').classList.toggle('lado-recolhido', !!UI.ladoRecolhido); }
try { UI.ladoRecolhido = localStorage.getItem('rf-lado-recolhido') === 'sim'; } catch (_) { UI.ladoRecolhido = false; }
async function iniciar() {
  aplicarLadoRecolhido();
  render();
  if (!(window.claude && typeof window.claude.use === 'function')) { entrarModoLocal(); return; }
  usar('sample').then((s) => { ia = s; agendarRender(); });
  usar('downloads').then((d) => { downloads = d; agendarRender(); });
  usar('assets').then((a) => { assets = a; agendarRender(); });
  usar('user').then(async (u) => {
    if (!u) return;
    try { if ((await u.can('data.write')) === false) { S.podeEditar = false; agendarRender(); } } catch (_) { /* sem resposta: a gravação decide */ }
  });
  db = await usar('db');
  if (!db) { entrarModoLocal(); return; }
  S.modo = 'nuvem';
  COLECOES.forEach((colecao) => {
    db.collection(colecao).onSnapshot((snap) => {
      S[colecao] = snap.docs.map((d) => Object.assign({}, d.data(), { id: d.id }));
      S.recebidos.add(colecao); conferirCarga(); agendarRender();
    }, erroDoBanco);
  });
  db.doc('config/geral').onSnapshot((snap) => {
    S.config = snap.exists ? Object.assign({}, snap.data()) : {};
    S.recebidos.add('config'); conferirCarga(); agendarRender();
  }, erroDoBanco);
  setTimeout(() => { if (!S.carregado) { S.carregado = true; agendarRender(); } }, 12000);
}
function entrarModoLocal() { S.modo = 'local'; S.carregado = true; agendarRender(); }
function conferirCarga() { if (!S.carregado && S.recebidos.size >= COLECOES.length + 1) S.carregado = true; }
function erroDoBanco(erro) { S.erroBanco = (erro && erro.code) || 'desconhecido'; agendarRender(); }
function corpoLimpo(dados) { const c = JSON.parse(JSON.stringify(dados)); delete c.id; return c; }

function traduzirErro(e) {
  const codigo = e && e.code;
  if (codigo === 'invalid_argument') { S.podeEditar = false; agendarRender(); return new Error('Não deu para salvar. Seu acesso a este sistema parece ser só de leitura.'); }
  if (codigo === 'quota_exceeded') return new Error('O armazenamento encheu. Baixe uma cópia em Ajustes e apague empresas antigas.');
  if (codigo === 'resource_exhausted') return new Error('Muitas gravações seguidas. Espere alguns segundos e tente de novo.');
  return new Error('Não deu para salvar agora. Tente de novo em instantes.');
}

async function gravar(colecao, id, dados) {
  const corpo = corpoLimpo(dados);
  if (S.modo !== 'nuvem') {
    if (colecao === 'config') S.config = corpo;
    else { const lista = S[colecao]; const i = lista.findIndex((x) => x.id === id); const item = Object.assign({}, corpo, { id }); if (i >= 0) lista[i] = item; else lista.push(item); }
    agendarRender(); return;
  }
  // Atualiza a lista local na hora: a próxima gravação já parte do valor novo, sem esperar o armazenamento responder
  if (colecao === 'config') S.config = corpo;
  else { const lista = S[colecao]; const i = lista.findIndex((x) => x.id === id); const item = Object.assign({}, corpo, { id }); if (i >= 0) lista[i] = item; else lista.push(item); }
  const ref = colecao === 'config' ? db.doc('config/geral') : db.collection(colecao).doc(id);
  try { await ref.set(corpo); }
  catch (e) {
    if (e && e.code === 'unavailable') { await esperar(500 + Math.random() * 700); try { await ref.set(corpo); return; } catch (e2) { throw traduzirErro(e2); } }
    throw traduzirErro(e);
  }
}
async function apagarRegistro(colecao, id) {
  if (S.modo !== 'nuvem') { S[colecao] = S[colecao].filter((x) => x.id !== id); agendarRender(); return; }
  try { await db.collection(colecao).doc(id).delete(); } catch (e) { throw traduzirErro(e); }
}

// Salva mudanças num gargalo e, se houver texto, registra no histórico dele
function salvarGargalo(g, mudancas, textoMovimento) {
  const atual = gargaloPorId(g.id) || g;
  const agora = agoraISO();
  const novo = Object.assign({}, atual, mudancas, { atualizadoEm: agora });
  if (textoMovimento) novo.movimentos = [{ em: agora, texto: textoMovimento }].concat(Array.isArray(atual.movimentos) ? atual.movimentos : []).slice(0, 15);
  return gravar('gargalos', g.id, novo);
}
// Muda a situação de um gargalo, com opção de desfazer no aviso
async function mudarSituacao(id, nova, opcoes) {
  opcoes = opcoes || {};
  const g = gargaloPorId(id); if (!g) return false;
  const antiga = situacaoDe(g);
  if (antiga === nova) return false;
  const anterior = JSON.parse(JSON.stringify(g));
  try {
    await salvarGargalo(g, { situacao: nova }, `Passou de ${antiga} para ${nova}`);
    toast(opcoes.mensagem || `“${g.titulo}” foi para ${nova}.`, '', { rotulo: 'Desfazer', fn: () => gravar('gargalos', anterior.id, anterior).catch((x) => toast(x.message, 'erro')) });
    return true;
  } catch (x) { toast(x.message, 'erro'); return false; }
}

/* Transição entre telas
   - trocar de aba na mesma empresa ou no mesmo setor: a tela desliza de leve;
   - ir para outra tela (pelo menu, por um botão ou pelo comando de voz): a tela some com desfoque e a nova sobe;
   - entrar num setor pela sala do escritório: a página abre num círculo que nasce do clique.
   Usa as transições do próprio navegador; onde não houver, a tela nova só aparece suave. */
const familiaDaRota = (r) => r.v === 'setor' ? 's:' + r.id : ['empresa', 'checkup', 'questionario'].includes(r.v) ? 'e:' + r.id : r.v === 'ia' ? 'ia' : r.v;
function trocarDeTela(r, fazer) {
  const antes = UI.rotaAnterior || { v: '' }; UI.rotaAnterior = r;
  const reduzido = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const origem = UI.origemTransicao && performance.now() - UI.origemTransicao.t < 2500 ? UI.origemTransicao : null; UI.origemTransicao = null;
  const tipo = origem ? 'circulo' : familiaDaRota(antes) === familiaDaRota(r) ? 'aba' : 'pagina';
  const raiz = document.documentElement;
  if (reduzido || r.v === 'apresentar' || antes.v === 'apresentar') { fazer(); return; }
  if (!document.startViewTransition) { fazer(); const m = $('#principal .miolo'); if (m) { m.classList.add('entra-' + tipo); } return; }
  if (origem) { raiz.style.setProperty('--vt-x', origem.x + 'px'); raiz.style.setProperty('--vt-y', origem.y + 'px'); }
  raiz.classList.add('vt-' + tipo);
  try {
    const tr = document.startViewTransition(() => fazer());
    tr.finished.finally(() => raiz.classList.remove('vt-aba', 'vt-pagina', 'vt-circulo'));
  } catch (x) { raiz.classList.remove('vt-' + tipo); fazer(); }
}

// Os números grandes sobem de zero quando a tela abre
function animarNumeros() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  document.querySelectorAll('[data-contar]').forEach((el) => {
    const alvo = Number(el.dataset.contar); if (!alvo) return;
    const inicio = performance.now(), duracao = 900;
    const passo = (agora) => {
      const p = Math.min(1, (agora - inicio) / duracao), suave = 1 - Math.pow(1 - p, 3);
      el.textContent = fmtHoras(alvo * suave);
      if (p < 1) requestAnimationFrame(passo); else el.textContent = fmtHoras(alvo);
    };
    requestAnimationFrame(passo);
  });
}

  card.insertAdjacentHTML('beforeend', `<div class="festa" aria-hidden="true">${pecas}<b>${esc(texto)}</b></div>`);
  setTimeout(() => { const f = card.querySelector('.festa'); if (f) f.remove(); }, 2600);
}

/* ---------- Check-up Empresarial: diagnóstico padronizado por setor ----------
   Cada tipo de setor tem 10 critérios de boa prática, cada um ligado a um destes quatro eixos:
   Processo, Informação e sistemas, Pessoas, Controle e indicadores.
   O consultor responde Sim (vale 100), Em parte (vale 50) ou Não (vale 0) e pode anotar a evidência.
   Nota do setor = média das respostas (0 a 100). Nota da empresa = média das notas dos setores avaliados.
   Situação do setor: algum "Não" = Crítico; algum "Em parte" = Atenção; todos "Sim" = Saudável.
   Os critérios são o padrão da Real Forte: os sócios revisam e ajustam aqui. */
const EIXOS = { P: 'Processo', I: 'Informação e sistemas', G: 'Pessoas', C: 'Controle e indicadores' };
const VALOR_RESPOSTA = { sim: 100, parte: 50, nao: 0 };
// Cada critério: [eixo, texto]. A ordem não muda (as respostas já guardadas usam a posição).

const TIPOS_SETOR = Object.keys(DIAGNOSTICOS);
const SAUDE = {
  critico: { nome: 'Crítico', classe: 's-critico' }, atencao: { nome: 'Atenção', classe: 's-execucao' },
  saudavel: { nome: 'Saudável', classe: 's-resolvido' }, andamento: { nome: 'Em diagnóstico', classe: 's-aberto' },
  sem: { nome: 'Sem diagnóstico', classe: 's-aberto' }
};
const ORDEM_SAUDE = { critico: 0, atencao: 1, andamento: 2, sem: 3, saudavel: 4 };
// Tipo do setor: o que você escolheu no diagnóstico, ou um palpite pelo nome
function tipoDoSetor(s) {
  if (s.tipo && DIAGNOSTICOS[s.tipo]) return s.tipo;
  const n = normal(s.nome);
  if (/fatur|fiscal|nota fiscal/.test(n)) return 'faturamento';
  if (/financ|contab|tesour|cobranc/.test(n)) return 'financeiro';
  if (/compra|suprim/.test(n)) return 'compras';
  if (/comerc|vend/.test(n)) return 'comercial';
  if (/logist|estoq|expedi|armaz|entreg|frota|transp|deposito/.test(n)) return 'logistica';
  if (/produc|fabric|industr|manutenc/.test(n)) return 'producao';
  if (/\brh\b|recursos humanos|pessoal|\bdp\b/.test(n)) return 'rh';
  if (/atendim|sac|pos-venda|pos venda|suporte ao cliente/.test(n)) return 'atendimento';
  if (/marketing|mkt|comunicac/.test(n)) return 'marketing';
  if (/\bti\b|tecnolog|sistema|informatica/.test(n)) return 'ti';
  if (/diretor|gestao|gerencia geral|socio/.test(n)) return 'gestao';
  return 'geral';
}
const media = (lista) => lista.length ? Math.round(lista.reduce((a, b) => a + b, 0) / lista.length) : null;
function diagnosticoDe(s) {
  const tipo = tipoDoSetor(s);
  const resp = (s.diagnostico && s.diagnostico.respostas) || {};
  const itens = DIAGNOSTICOS[tipo].criterios.map(([eixo, texto], i) => { const id = `${tipo}${i + 1}`; const r = resp[id] || {}; return { id, eixo, texto, r: r.r || '', ev: r.ev || '' }; });
  const respondidos = itens.filter((x) => x.r);
  const criticos = itens.filter((x) => x.r === 'nao'), atencao = itens.filter((x) => x.r === 'parte');
  const saude = !respondidos.length ? 'sem' : criticos.length ? 'critico' : atencao.length ? 'atencao' : respondidos.length === itens.length ? 'saudavel' : 'andamento';
  const eixos = {};
  Object.keys(EIXOS).forEach((k) => { eixos[k] = media(respondidos.filter((x) => x.eixo === k).map((x) => VALOR_RESPOSTA[x.r])); });
  return { tipo, nomeTipo: DIAGNOSTICOS[tipo].nome, itens, respondidas: respondidos.length, total: itens.length, criticos, atencao, saude, nota: media(respondidos.map((x) => VALOR_RESPOSTA[x.r])), eixos };
}
// Check-up da empresa: nota geral, notas por eixo e as maiores oportunidades (o que não está atendido)
function checkupDa(empresaId) {
  const setores = setoresDa(empresaId).map((s) => ({ s, d: diagnosticoDe(s) }));
  const avaliados = setores.filter((x) => x.d.nota != null);
  const eixos = {};
  Object.keys(EIXOS).forEach((k) => { eixos[k] = media(avaliados.map((x) => x.d.eixos[k]).filter((v) => v != null)); });
  const oportunidades = [];
  avaliados.forEach(({ s, d }) => d.itens.filter((x) => x.r === 'nao' || x.r === 'parte').forEach((x) => oportunidades.push({ s, d, x })));
  oportunidades.sort((a, b) => (a.x.r === 'nao' ? 0 : 1) - (b.x.r === 'nao' ? 0 : 1) || a.d.nota - b.d.nota);
  return { setores, avaliados, nota: media(avaliados.map((x) => x.d.nota)), eixos, oportunidades, respondidos: avaliados.reduce((t, x) => t + x.d.respondidas, 0) };
}

function anelNota(nota, tam, classe) {
  const n = nota == null ? 0 : nota;
  return `<span class="anel-nota ${classe || ''}" style="--tam:${tam}px">${anel(n, tam, Math.max(4, Math.round(tam / 11)))}<b>${nota == null ? '–' : nota}</b></span>`;
}

}

  const cartoes = diags.map(({ s, d }) => {

      <div class="cs-topo"><div><h3>${esc(s.nome)}</h3><p class="meta">${esc(d.nomeTipo)}</p></div>${anelNota(d.nota, 50, classeNota(d))}</div>

Se a melhor saída não for uma ferramenta (mudar o processo ou cortar a tarefa), me diga isso antes de construir qualquer coisa.`;

/* ---------- Cano do setor (aba Gargalos) ----------
   As tarefas do setor são bolinhas de luz correndo por um cano, da entrada até a entrega.
   Cada gargalo é um registro no cano, na ordem em que foi encontrado:
   - vermelho (aberto, proposta pronta ou apresentado): trava, as bolinhas se acumulam antes dele;
   - amarelo (em execução): passa devagar;
   - verde (resolvido): passa livre.
   Quando um gargalo vira "Resolvido", o registro solta um brilho verde e o fluxo volta a correr.
   É uma figura para o dono entender o problema; não mede nada. */
const CANO = { estado: new Map() };
const FLUXO_CANO = { trava: 0.06, melhora: 0.38, livre: 1 };
const estadoNoCano = (g) => { const s = situacaoDe(g); return s === 'Resolvido' ? 'livre' : s === 'Em execução' ? 'melhora' : 'trava'; };
function canoHTML(s) {
  const garg = gargalosDo(s.id).slice().sort((a, b) => String(a.criadoEm || '').localeCompare(String(b.criadoEm || '')) || String(a.id).localeCompare(String(b.id))).slice(0, 6);
  if (!garg.length) return '';
  const n = garg.length;
  const rotulos = garg.map((g, i) => {
    const est = estadoNoCano(g);
    const nome = { trava: 'travando', melhora: 'melhorando', livre: 'liberado' }[est];
    return `<span class="cano-rot ${est}" style="left:${((i + 1) / (n + 1) * 100).toFixed(2)}%"><b>${esc(String(g.titulo).length > 34 ? String(g.titulo).slice(0, 32) + '…' : g.titulo)}</b><i>${nome}</i></span>`;
  }).join('');
  const travando = garg.filter((g) => estadoNoCano(g) === 'trava').length;
  const resumo = travando ? `${plural(travando, 'ponto travando', 'pontos travando')} o fluxo do setor` : 'O fluxo do setor está correndo';
  return `<section class="cano" data-setor="${esc(s.id)}" data-gargalos="${esc(garg.map((g) => g.id + ':' + estadoNoCano(g)).join('|'))}" aria-label="${esc(resumo)}">
    <div class="cano-topo"><span class="rotulo">O fluxo do setor</span><span class="cano-resumo ${travando ? 'trava' : 'livre'}">${esc(resumo)}</span></div>
    <div class="cano-palco"><canvas></canvas><span class="cano-ponta e">Chega</span><span class="cano-ponta s">Sai pronto</span></div>
    <div class="cano-rotulos">${rotulos}</div>
  </section>`;
}
// Liga cada cano que está na tela (o estado das bolinhas continua de uma tela para outra)
function iniciarCanos() {
  document.querySelectorAll('.cano').forEach((el) => {
    if (el.dataset.ligado) return; el.dataset.ligado = '1';
    const setorId = el.dataset.setor;
    const nos = el.dataset.gargalos.split('|').filter(Boolean).map((x) => { const [id, est] = x.split(':'); return { id, est }; });
    let st = CANO.estado.get(setorId);
    if (!st) { st = { bolinhas: [], ultimo: 0, antes: {}, brilhos: [] }; CANO.estado.set(setorId, st); }
    // Registro que acabou de virar "livre": brilho verde
    nos.forEach((n, i) => { if (st.antes[n.id] && st.antes[n.id] !== 'livre' && n.est === 'livre') st.brilhos.push({ i, t: 0 }); st.antes[n.id] = n.est; });
    const tela = el.querySelector('canvas'); const ctx = tela.getContext('2d');
    const parado = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let W = 0, H = 0;
    const medir = () => { const r = tela.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1); W = r.width; H = r.height; tela.width = Math.round(W * dpr); tela.height = Math.round(H * dpr); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    medir();
    const xNo = (i) => W * (i + 1) / (nos.length + 1);
    const ZONA = 26, VEL = 78, FOLGA = 8;
    const passo = (dt) => {
      // Entra uma tarefa nova de tempos em tempos, se tiver espaço na entrada
      st.ultimo += dt;
      const ultima = st.bolinhas[st.bolinhas.length - 1];
      if (st.ultimo > 0.22 && (!ultima || ultima.x > FOLGA + 2) && st.bolinhas.length < 220) { st.bolinhas.push({ x: 0, y: (Math.random() - 0.5) * 6, v: VEL }); st.ultimo = 0; }
      // Anda da frente para trás: ninguém passa a bolinha da frente
      for (let k = 0; k < st.bolinhas.length; k++) {
        const b = st.bolinhas[k];
        let fator = 1, perto = null;

const logoDe = (e) => (e && (e.logo || (e.logoId ? srcAnexo(e.logoId) : ''))) || '';
function prepararLogo(arquivo) {
  return new Promise((ok, falha) => {
    const img = new Image(); const url = URL.createObjectURL(arquivo);
    img.onload = () => {
      const w0 = img.width || 600, h0 = img.height || 200;
      const gerar = (lado) => {
        const k = Math.min(1, lado / Math.max(w0, h0));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * k)); c.height = Math.max(1, Math.round(h0 * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); return c.toDataURL('image/png');
      };
      let dados = gerar(480); if (dados.length > 150000) dados = gerar(300); if (dados.length > 150000) dados = gerar(200);
      URL.revokeObjectURL(url); ok(dados);
    };
    img.onerror = () => { URL.revokeObjectURL(url); falha(new Error('logo')); };
    img.src = url;
  });
}

function promptTransformar(s) {

Regras:

const ALFABETO_B32 = 'abcdefghijklmnopqrstuvwxyz234567';
function b32codificar(texto) {
  let valor = 0, bits = 0, saida = '';
  for (const b of new TextEncoder().encode(texto)) {
    valor = (valor << 8) | b; bits += 8;
    while (bits >= 5) { saida += ALFABETO_B32[(valor >> (bits - 5)) & 31]; bits -= 5; }
    valor &= (1 << bits) - 1;
  }
  if (bits > 0) saida += ALFABETO_B32[(valor << (5 - bits)) & 31];
  return saida;
}

/* ---------- RF Sinais ----------
   Os setores das empresas mandam "algo está travando" por uma página do Google (fora do Claude).
   A página grava numa planilha e avisa por e-mail. Aqui você traz os sinais (colando as linhas

const COLUNAS_SINAIS = ['codigo', 'recebido_em', 'empresa_id', 'empresa', 'setor', 'o_que_trava', 'frequencia', 'quanto_atrapalha', 'nome', 'contato', 'anexos'];   // "anexos" veio depois, no fim

const ENDERECO_ANEXO = /^https:\/\/(drive|docs)\.google\.com\/[^\s"'<>()|]+$/;
const CODIGO_SINAL = /^S-[0-9A-F]{8}$/i;
const ENDERECO_SINAIS = /^https:\/\/script\.google\.com\/(a\/[^/\s]+\/)?macros\/s\/[\w-]+\/exec$/;
const ESTADOS_SINAL = [['novo', 'Novos'], ['gargalo', 'Viraram gargalo'], ['arquivado', 'Arquivados']];

const sinaisNovos = () => S.sinais.filter((x) => (x.estado || 'novo') === 'novo').length;
const empresaDoSinal = (x) => empresaPorId(x.empresaId) || S.empresas.find((e) => normal(e.nome) === normal(x.empresa));

// Link de cada empresa: endereço da página + código, nome e setores da empresa
function linkSinais(e) {
  const base = S.config.sinaisUrl; if (!base || !e) return '';
  const setores = setoresDa(e.id).map((s) => String(s.nome || '').replace(/\|/g, '/')).filter(Boolean).slice(0, 15);
  return `${base}?e=${encodeURIComponent(e.id)}&n=${encodeURIComponent(e.nome || '')}${setores.length ? '&s=' + encodeURIComponent(setores.join('|')) : ''}`;
}
function conviteSinais(e) {

}

/* Lê o que você colou ou subiu:
   - linhas copiadas da planilha (separadas por tabulação);
   - o arquivo .csv baixado da planilha;
   - o texto do e-mail (a linha que começa com RF-SINAL). */
function lerTabela(texto, sep) {
  const linhas = []; let linha = [], campo = '', aspas = false;
  for (let i = 0; i < texto.length; i++) {
    const ch = texto[i];
    if (aspas) { if (ch === '"') { if (texto[i + 1] === '"') { campo += '"'; i++; } else aspas = false; } else campo += ch; }
    else if (ch === '"' && campo === '') aspas = true;
    else if (ch === sep) { linha.push(campo); campo = ''; }
    else if (ch === '\n') { linha.push(campo); linhas.push(linha); linha = []; campo = ''; }
    else campo += ch;
  }
  if (campo || linha.length) { linha.push(campo); linhas.push(linha); }
  return linhas;
}
/* Anexos de um sinal. Chegam de dois jeitos:
   - da planilha: "link (nome do arquivo) | link (nome do arquivo)";
   - do e-mail (linha RF-SINAL): lista de { nome, url }.
   Devolve [{ nome, url }], só com links do Drive. */
function lerAnexosSinal(v) {
  const lista = Array.isArray(v) ? v.map((a) => ({ url: String((a && a.url) || '').trim(), nome: String((a && a.nome) || '').trim() }))
    : String(v || '').split('|').map((p) => { const m = p.trim().match(/^(\S+)\s*(?:\((.*)\))?$/); return m ? { url: m[1], nome: String(m[2] || '').trim() } : null; }).filter(Boolean);
  return lista.filter((a) => ENDERECO_ANEXO.test(a.url)).slice(0, 3).map((a, i) => ({ url: a.url, nome: a.nome || `Anexo ${i + 1}` }));
}
function lerSinais(bruto) {
  const texto = String(bruto || '').replace(/\r\n?/g, '\n');
  const achados = new Map();
  const guardar = (o) => {
    const codigo = String(o.codigo || '').trim().toUpperCase();
    if (!CODIGO_SINAL.test(codigo) || achados.has(codigo)) return;
    achados.set(codigo, {
      id: codigo, codigo, recebidoEm: String(o.recebido_em || '').trim(), empresaId: String(o.empresa_id || '').trim(), empresa: String(o.empresa || '').trim(),
      setor: String(o.setor || '').trim(), texto: String(o.o_que_trava || '').trim(), frequencia: String(o.frequencia || '').trim(),
      atrapalha: String(o.quanto_atrapalha || '').trim(), nome: String(o.nome || '').trim(), contato: String(o.contato || '').trim(),
      anexos: lerAnexosSinal(o.anexos)
    });
  };
  // Do e-mail
  (texto.match(/RF-SINAL (\{.*\})/g) || []).forEach((l) => { try { guardar(JSON.parse(l.slice(9))); } catch (_) { /* linha cortada: ignora */ } });
  // Da planilha (colada ou arquivo)
  const sep = texto.includes('\t') ? '\t' : ',';
  let ordem = COLUNAS_SINAIS;
  lerTabela(texto, sep).forEach((cel) => {
    const limpo = cel.map((c) => String(c).replace(/^'/, '').trim());
    if (limpo[0] === 'codigo') { ordem = limpo; return; }
    const o = {}; ordem.forEach((k, i) => { o[k] = limpo[i]; }); guardar(o);
  });
  return [...achados.values()];
}

  const conta = (k) => todos.filter((x) => (x.estado || 'novo') === k).length;

/* ---------- Feedback do Lucas ----------
   As pessoas dos setores por onde o Lucas passou respondem por uma página do Google (fora do Claude),
   com nota de 1 a 5 em cada critério e dois comentários. A página grava numa planilha. Aqui o Lucas
   declara as regras (setores, critérios, anônima ou identificada, quem vê os resultados), copia o link
   e traz as respostas colando as linhas da planilha. Nenhuma dessas regras vem pronta: tudo nasce em
   branco e a tela diz o que falta e quem declara. */
const COLUNAS_FEEDBACK = ['codigo', 'recebido_em', 'setor', 'notas', 'o_que_funcionou', 'o_que_podia_melhorar', 'nome', 'envio'];
const CODIGO_FEEDBACK = /^F-[0-9A-F]{8}$/i;
const MODOS_FEEDBACK = [['anonima', 'Anônima', 'A página não pede nome.'], ['identificada', 'Identificada', 'A página pede o nome de quem responde.']];
const QUEM_VE_FEEDBACK = [
  ['planilha', 'Só quem tem a planilha', 'Nada fica guardado no painel: você cola as respostas cada vez que for ver (o F5 limpa).'],
  ['editores', 'Quem pode editar o painel', 'As respostas ficam guardadas no painel e só aparecem para quem tem acesso de edição.'],
  ['todos', 'Todos que abrem o painel', 'As respostas ficam guardadas e aparecem para todo mundo que abre o painel.']
];
// A configuração guardada (tudo vazio até o Lucas declarar)
const configFeedback = () => Object.assign({ url: '', setores: [], criterios: [], modo: '', quemVe: '', minimo: '' }, S.config.feedback || {});
// O que ainda falta declarar. "para": o que fica parado enquanto falta (o link ou os resultados).
function faltaFeedback(c) {
  const f = [];
  if (!c.url) f.push({ item: 'o endereço da página do Google (termina em /exec)', para: 'link' });
  if (!c.setores.length) f.push({ item: 'a lista de setores', para: 'link' });
  if (!c.criterios.length) f.push({ item: 'a lista de critérios', para: 'link' });
  if (!c.modo) f.push({ item: 'se a resposta é anônima ou identificada', para: 'link' });
  if (!c.quemVe) f.push({ item: 'quem pode ver os resultados', para: 'resultados' });
  if (c.modo === 'anonima' && !(Number(c.minimo) >= 1)) f.push({ item: 'o mínimo de respostas de um setor para mostrar a média dele (na resposta anônima, setor com uma resposta só entrega quem respondeu)', para: 'resultados' });
  return f;
}
// Link que vai para as pessoas: endereço da página + setores, critérios e modo (o "|" separa os itens)
function linkFeedback(c) {
  const lista = (l) => encodeURIComponent(l.map((x) => String(x).replace(/\|/g, '/')).join('|'));
  return `${c.url}?s=${lista(c.setores)}&c=${lista(c.criterios)}&m=${c.modo}`;
}
function conviteFeedback(c) {
  return `Oi! Aqui é o Lucas. Passei pelo setor de vocês e queria saber como foi o meu trabalho, para eu melhorar. Leva uns 2 minutos:\n${linkFeedback(c)}\n\n${c.modo === 'anonima' ? 'A resposta é anônima: a página não pede o seu nome.' : 'A página pede o seu nome.'} Obrigado!`;
}
// De onde vêm as respostas: guardadas no painel ou só as coladas agora (quando nada pode ficar guardado)
const respostasFeedback = (c) => (c.quemVe === 'planilha' ? UI.feedbackColadas || [] : S.feedback);

/* Lê o que foi colado: linhas da planilha (tabulação) ou o arquivo .csv.
   Devolve as respostas reconhecidas e quantas linhas foram ignoradas. */
function lerRespostasFeedback(bruto) {
  const texto = String(bruto || '').replace(/\r\n?/g, '\n');
  const achadas = new Map(); let ignoradas = 0, ordem = COLUNAS_FEEDBACK;
  lerTabela(texto, texto.includes('\t') ? '\t' : ',').forEach((cel) => {
    const limpo = cel.map((x) => String(x).replace(/^'/, '').trim());
    if (!limpo.some(Boolean)) return;   // linha vazia
    if (limpo[0] === 'codigo') { ordem = limpo; return; }   // cabeçalho
    const o = {}; ordem.forEach((k, i) => { o[k] = limpo[i] || ''; });
    const codigo = String(o.codigo).toUpperCase();
    const notas = String(o.notas).split('|').map((p) => { const i = p.lastIndexOf(':'); return i > 0 ? { criterio: p.slice(0, i).trim(), nota: Number(p.slice(i + 1)) } : null; })
      .filter((n) => n && n.criterio && Number.isInteger(n.nota) && n.nota >= 1 && n.nota <= 5);
    if (!CODIGO_FEEDBACK.test(codigo) || !o.setor || !notas.length) { ignoradas++; return; }
    achadas.set(codigo, { id: codigo, codigo, recebidoEm: o.recebido_em, setor: o.setor, notas, funcionou: o.o_que_funcionou, melhorar: o.o_que_podia_melhorar, nome: o.nome });
  });
  return { respostas: [...achadas.values()], ignoradas };
}

/* As contas: média de cada critério por setor e no geral (uma casa), respostas por setor e
   comentários por setor. Setor ou critério que não está na lista atual entra marcado "fora da lista". */
function resultadosFeedback(respostas, c) {
  const nomes = (lista, extra) => { const base = lista.slice(); extra.forEach((x) => { if (!base.some((b) => normal(b) === normal(x))) base.push(x); }); return base; };
  const setores = nomes(c.setores, respostas.map((r) => r.setor));
  const criterios = nomes(c.criterios, [].concat(...respostas.map((r) => r.notas.map((n) => n.criterio))));
  const media = (lista) => (lista.length ? lista.reduce((a, b) => a + b, 0) / lista.length : null);
  const notasDe = (rs, crit) => [].concat(...rs.map((r) => r.notas.filter((n) => normal(n.criterio) === normal(crit)).map((n) => n.nota)));
  const minimo = c.modo === 'anonima' ? Number(c.minimo) || 0 : 0;
  const porSetor = setores.map((nome) => {
    const rs = respostas.filter((r) => normal(r.setor) === normal(nome));
    const oculto = minimo > 0 && rs.length > 0 && rs.length < minimo;   // anônima com poucas respostas: não mostra média nem comentário
    return { nome, rs, fora: !c.setores.some((x) => normal(x) === normal(nome)), n: rs.length, oculto,
      medias: Object.fromEntries(criterios.map((crit) => [crit, oculto ? null : media(notasDe(rs, crit))])),
      comentarios: oculto ? [] : rs.filter((r) => r.funcionou || r.melhorar).map((r) => ({ funcionou: r.funcionou, melhorar: r.melhorar, nome: c.modo === 'identificada' ? r.nome : '' })) };
  });
  /* O geral também deixa de fora o setor escondido: senão, com a média geral e a dos outros setores,
     dá para descobrir a nota dele fazendo a conta (e a regra do mínimo não protegeria ninguém). */
  const contam = [].concat(...porSetor.filter((x) => !x.oculto).map((x) => x.rs));
  return {
    total: respostas.length, totalGeral: contam.length, temOculto: porSetor.some((x) => x.oculto),
    criterios: criterios.map((nome) => ({ nome, fora: !c.criterios.some((x) => normal(x) === normal(nome)), geral: media(notasDe(contam, nome)) })),
    setores: porSetor
  };
}
