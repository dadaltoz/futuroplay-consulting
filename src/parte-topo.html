<title>Real Forte Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
/* Layout: barra lateral azul-marinho fixa (a torre da Real Forte, o início e as empresas) e a área de
   trabalho clara à direita. Três telas, um lugar para cada coisa: Início (horas devolvidas e empresas),
   Empresa (setores, PDF e questionário) e Setor (o que eu vi e os gargalos, que abrem no próprio cartão).
   Nenhuma janela abre em cima de outra. No celular, a barra lateral vira menu. */
:root{
  --bg:#F2F4F7; --surface:#FFFFFF; --surface-2:#F7F8FB; --surface-3:#EEF1F5; --line:#E2E6EC; --line-2:#CBD3DE;
  --ink:#0E1A2C; --muted:#5B6679; --faint:#8C96A8;
  --navy:#0F2342; --navy-2:#162D52; --navy-3:#23416F; --navy-ink:#EEF2F8; --navy-muted:#97A8C4; --navy-line:#21395F;
  --accent:#D9681A; --accent-2:#EF8B42; --accent-ink:#A9500E; --accent-soft:#FCEFE4;
  --btn:#0F2342; --btn-ink:#FFFFFF;
  --st-aberto:#7D889B; --st-aberto-soft:#EDF0F4;
  --st-proposta:#D9681A; --st-proposta-soft:#FCEFE4;
  --st-apresentado:#2F5EA8; --st-apresentado-soft:#E6EDF8;
  --st-execucao:#A86E12; --st-execucao-soft:#FAF0DC;
  --st-resolvido:#1C7F52; --st-resolvido-soft:#E2F2E9;
  --bad:#B9362C; --bad-soft:#F9E5E2;
  --veu:rgba(8,16,32,.48);
  --sombra-1:0 1px 2px rgba(14,26,44,.06);
  --sombra-2:0 6px 18px rgba(14,26,44,.09), 0 1px 3px rgba(14,26,44,.06);
  --sombra-3:0 24px 64px rgba(8,16,32,.28);
  --f-titulo:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --f-texto:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --raio:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A111D; --surface:#101A2B; --surface-2:#132036; --surface-3:#182740; --line:#1F2E47; --line-2:#2E4264;
    --ink:#E6ECF5; --muted:#97A3B9; --faint:#6F7C93;
    --navy:#070D18; --navy-2:#0F1B30; --navy-3:#1A2C4C; --navy-ink:#E6ECF5; --navy-muted:#8395B3; --navy-line:#18263F;
    --accent:#EF8B42; --accent-2:#F5A060; --accent-ink:#F5A060; --accent-soft:#33210F;
    --btn:#E6ECF5; --btn-ink:#0A111D;
    --st-aberto:#8C98AD; --st-aberto-soft:#1A2639;
    --st-proposta:#EF8B42; --st-proposta-soft:#33210F;
    --st-apresentado:#86A9E6; --st-apresentado-soft:#14284A;
    --st-execucao:#E3A847; --st-execucao-soft:#33270F;
    --st-resolvido:#46B582; --st-resolvido-soft:#0F2E20;
    --bad:#E86C61; --bad-soft:#3B1816;
    --veu:rgba(0,0,0,.6);
    --sombra-1:0 1px 0 rgba(0,0,0,.3); --sombra-2:0 8px 24px rgba(0,0,0,.4); --sombra-3:0 24px 64px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A111D; --surface:#101A2B; --surface-2:#132036; --surface-3:#182740; --line:#1F2E47; --line-2:#2E4264;
  --ink:#E6ECF5; --muted:#97A3B9; --faint:#6F7C93;
  --navy:#070D18; --navy-2:#0F1B30; --navy-3:#1A2C4C; --navy-ink:#E6ECF5; --navy-muted:#8395B3; --navy-line:#18263F;
  --accent:#EF8B42; --accent-2:#F5A060; --accent-ink:#F5A060; --accent-soft:#33210F;
  --btn:#E6ECF5; --btn-ink:#0A111D;
  --st-aberto:#8C98AD; --st-aberto-soft:#1A2639;
  --st-proposta:#EF8B42; --st-proposta-soft:#33210F;
  --st-apresentado:#86A9E6; --st-apresentado-soft:#14284A;
  --st-execucao:#E3A847; --st-execucao-soft:#33270F;
  --st-resolvido:#46B582; --st-resolvido-soft:#0F2E20;
  --bad:#E86C61; --bad-soft:#3B1816;
  --veu:rgba(0,0,0,.6);
  --sombra-1:0 1px 0 rgba(0,0,0,.3); --sombra-2:0 8px 24px rgba(0,0,0,.4); --sombra-3:0 24px 64px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-texto);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--navy)}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-titulo);font-weight:600;font-size:clamp(26px,3vw,34px);line-height:1.15;letter-spacing:-.01em}
h2{font-family:var(--f-titulo);font-weight:600;font-size:19px;line-height:1.25}
h3{font-size:15px;font-weight:600;line-height:1.35}
p{margin:0}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.ic{display:inline-flex;flex:none}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;display:block}
.torre{fill:currentColor}
.rotulo{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta{color:var(--muted);font-size:13px}
.num{font-family:var(--f-titulo);font-weight:600}

/* ---------- Estrutura ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--navy) 268px,transparent 268px)}
.lado{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px));background:var(--navy);color:var(--navy-ink);display:flex;flex-direction:column;gap:18px;padding-block:22px 16px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px;overflow-y:auto;z-index:40;scrollbar-width:thin;scrollbar-color:var(--navy-3) transparent}
.marca{display:flex;align-items:center;gap:11px;text-decoration:none;padding:0 8px}
/* Logo da Real Forte em versão clara (azul trocado por branco) para ficar legível no fundo azul-marinho */
.logo{display:block;flex:none;width:190px;aspect-ratio:300/82;background:var(--logo-claro) no-repeat left center/contain}
.lado .marca{flex-direction:column;align-items:flex-start;gap:8px;padding:2px 8px 4px}
.marca-sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--navy-muted)}
.busca-btn{display:flex;align-items:center;gap:9px;width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--navy-line);background:var(--navy-2);color:var(--navy-muted);cursor:pointer;font-size:13.5px;text-align:left}
.busca-btn:hover{color:var(--navy-ink);border-color:var(--navy-3)}
.busca-btn kbd{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;padding:1px 6px;border-radius:4px;border:1px solid var(--navy-3);color:var(--navy-muted)}
.lado-sec{display:flex;flex-direction:column;gap:2px}
.lado-titulo{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--navy-muted)}
.lado-titulo button{border:0;background:none;color:var(--navy-muted);cursor:pointer;padding:2px;border-radius:4px;display:inline-flex}
.lado-titulo button:hover{color:var(--navy-ink);background:var(--navy-2)}
.lado-link{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--navy-muted);font-weight:500;font-size:14px;min-width:0;border:0;background:none;cursor:pointer;width:100%;text-align:left}
.lado-link:hover{background:var(--navy-2);color:var(--navy-ink)}
.lado-link.ativo{background:var(--navy-3);color:var(--navy-ink)}
.lado-link.ativo .ic{color:var(--accent)}
.lado-link .nome{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lado-badge{font-family:var(--f-mono);font-size:10.5px;font-weight:500;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#1A0E04;display:inline-grid;place-items:center}
.lado-vazio{padding:4px 10px;font-size:12.5px;color:var(--navy-muted)}
.lado-rodape{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--navy-line);padding-top:12px}
.lado-usuario{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px;color:var(--navy-muted)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--navy-3);color:var(--navy-ink);display:grid;place-items:center;font-size:11.5px;font-weight:600;flex:none;border:1.5px solid var(--accent)}
.anel{flex:none;display:block}
.anel .trilho{stroke:var(--navy-3)}
.anel .valor{stroke:var(--accent);transition:stroke-dashoffset .5s ease}
.conteudo .anel .trilho{stroke:var(--surface-3)}
.conteudo .anel .valor{stroke:var(--st-resolvido)}

.barra-movel{display:none}
.lado-fundo{display:none}
.area{min-width:0;display:flex;flex-direction:column}
.conteudo{padding-block:30px 96px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px));min-width:0}
.miolo{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:26px;min-width:0}

@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr);background:none}
  .lado{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);height:100dvh;padding-top:calc(22px + env(safe-area-inset-top,0px));transform:translateX(-102%);transition:transform .22s ease;box-shadow:var(--sombra-3)}
  .app.menu-aberto .lado{transform:none}
  .lado-fundo{display:block;position:fixed;inset:0;background:var(--veu);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
  .app.menu-aberto .lado-fundo{opacity:1;pointer-events:auto}
  .barra-movel{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--navy);color:var(--navy-ink);align-items:center;gap:10px;padding-block:10px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));border-bottom:2px solid var(--accent)}
  .barra-movel .marca{padding:0;flex:1;min-width:0}
  .barra-movel .logo{width:124px}
  .conteudo{padding-block:20px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .miolo{gap:22px}
}
.icone-btn{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent;color:inherit;cursor:pointer;flex:none}
.icone-btn:hover{background:var(--surface-3)}
.barra-movel .icone-btn:hover{background:var(--navy-2)}

/* ---------- Cabeçalhos ---------- */
.cab{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px 24px}
.cab > div:first-child{display:flex;flex-direction:column;gap:7px;min-width:0;flex:1 1 340px}
.olho{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub{color:var(--muted);max-width:68ch;font-size:15px}
.acoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.voltar{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:500;width:max-content;padding:4px 8px 4px 4px;margin-left:-4px;border-radius:6px}
.voltar:hover{color:var(--ink);background:var(--surface-3)}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.tag.exemplo{background:var(--st-execucao-soft);color:var(--st-execucao)}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;line-height:1.2;white-space:nowrap;transition:border-color .15s,background .15s,transform .1s}
.btn:hover{border-color:var(--ink)}
.btn:active{transform:translateY(1px)}
.btn.primario{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primario:hover{opacity:.9}
.btn.acento{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.acento:hover{filter:brightness(1.06)}
.btn.ia{border-color:var(--accent);color:var(--accent-ink)}
.btn.ia:hover{background:var(--accent-soft)}
.btn.ok{border-color:var(--st-resolvido);color:var(--st-resolvido)}
.btn.ok:hover{background:var(--st-resolvido-soft)}
.btn.perigo{color:var(--bad)}
.btn.perigo:hover{border-color:var(--bad)}
.btn.perigo.cheio{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.fantasma{border-color:transparent;background:transparent;color:var(--muted)}
.btn.fantasma:hover{background:var(--surface-3);color:var(--ink)}
.btn.peq{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- Avisos ---------- */
.aviso{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--raio);background:var(--st-execucao-soft);border:1px solid var(--line);font-size:14px}
.aviso .ic{color:var(--st-execucao);margin-top:2px}
.aviso.info{background:var(--st-apresentado-soft)}
.aviso.info .ic{color:var(--st-apresentado)}

/* ---------- Números do topo ---------- */
.kpis{display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:1180px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi-hero{grid-column:1/-1}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.kpis .kpi:nth-child(3){grid-column:1/-1;order:3}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:var(--sombra-1)}
.kpi-linha{display:flex;align-items:center;justify-content:space-between;gap:12px}
.kpi-num{font-family:var(--f-titulo);font-weight:600;font-size:32px;line-height:1.05;letter-spacing:-.01em}
.kpi-num small{font-size:15px;color:var(--muted);margin-left:3px;font-weight:500}
.kpi-nota{font-size:12.5px;color:var(--muted)}
.kpi-hero{background:var(--navy);border-color:var(--navy);color:var(--navy-ink);position:relative;overflow:hidden;padding:18px 22px}
.kpi-hero::after{content:"";position:absolute;inset:auto 0 0;height:3px;background:var(--accent)}
.kpi-hero .rotulo{color:var(--navy-muted)}
.kpi-hero .kpi-num{font-size:44px;color:var(--accent-2)}
.kpi-hero .kpi-num small{color:var(--navy-ink)}
.kpi-hero .kpi-nota{color:var(--navy-muted)}
.kpi-hero .ano{font-family:var(--f-titulo);font-size:20px;font-weight:600;color:var(--navy-ink);text-align:right;line-height:1.1}
.kpi-hero .ano span{display:block;font-family:var(--f-texto);font-size:11.5px;font-weight:400;color:var(--navy-muted)}
.mini-barras{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:4px}
.mini-barras i{display:block;background:var(--accent-2);opacity:.9}
.mini-barras i:nth-child(2n){opacity:.6}
.mini-barras i:nth-child(3n){opacity:.4}

/* ---------- Blocos ---------- */
.bloco{display:flex;flex-direction:column;gap:12px;min-width:0}
.bloco-cab{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bloco-cab h2 .conta{font-family:var(--f-mono);font-size:12.5px;font-weight:400;color:var(--muted);margin-left:6px}
.colunas-inicio{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:1100px){.colunas-inicio{grid-template-columns:minmax(0,1fr)}}
.painel{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);box-shadow:var(--sombra-1);min-width:0}
.painel-corpo{padding:18px}
.vazio{border:1px dashed var(--line-2);border-radius:var(--raio);padding:26px 22px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;color:var(--muted);background:var(--surface)}
.vazio h3{color:var(--ink);font-size:16px}
.vazio-mini{color:var(--muted);font-size:13.5px;padding:16px;text-align:center}

/* Próximo passo (lista de ações) */
.acoes-lista{display:flex;flex-direction:column}
.acao-item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:13px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;cursor:pointer;width:100%;transition:background .12s}
.acao-item:last-child{border-bottom:0}
.acao-item:hover{background:var(--surface-2)}
.acao-item .ponto{width:9px;height:9px;border-radius:50%;background:var(--cor,var(--st-aberto));grid-row:1/3}
.acao-item .titulo{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acao-item .onde{font-size:12.5px;color:var(--muted);grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acao-item .fazer{grid-column:3;grid-row:1/3;font-size:12.5px;font-weight:600;color:var(--cor,var(--ink));background:var(--cor-soft,var(--surface-3));padding:5px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
@media (max-width:560px){.acao-item{grid-template-columns:10px minmax(0,1fr)}.acao-item .fazer{grid-column:2;grid-row:auto;justify-self:start;margin-top:4px}}
.mais-acoes{border:0;border-top:1px solid var(--line);background:var(--surface-2);width:100%;padding:10px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;border-radius:0 0 var(--raio) var(--raio)}
.mais-acoes:hover{color:var(--ink)}

/* Cores por situação */
.s-aberto{--cor:var(--st-aberto);--cor-soft:var(--st-aberto-soft)}
.s-proposta{--cor:var(--st-proposta);--cor-soft:var(--st-proposta-soft)}
.s-apresentado{--cor:var(--st-apresentado);--cor-soft:var(--st-apresentado-soft)}
.s-execucao{--cor:var(--st-execucao);--cor-soft:var(--st-execucao-soft)}
.s-resolvido{--cor:var(--st-resolvido);--cor-soft:var(--st-resolvido-soft)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--cor-soft);color:var(--cor);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

/* Barra de etapas dos gargalos */
.barra-etapas{display:flex;height:10px;border-radius:5px;overflow:hidden;gap:2px;background:var(--surface-3)}
.barra-etapas .seg{border:0;padding:0;background:var(--cor);min-width:6px;cursor:pointer;transition:filter .15s, opacity .15s}
.barra-etapas .seg:hover{filter:brightness(1.12)}
.barra-etapas.estatica .seg{cursor:default}
.barra-etapas.fina{height:6px;border-radius:3px}
.barra-etapas.apagada .seg:not(.ativo){opacity:.3}
.legenda-etapas{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.legenda-etapas button{border:0;background:none;padding:2px 0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:inherit;font-size:inherit;border-radius:4px}
.legenda-etapas button:hover{color:var(--ink)}
.legenda-etapas button.ativo{color:var(--ink);font-weight:600}
.legenda-etapas i{width:9px;height:9px;border-radius:2px;background:var(--cor)}
.legenda-etapas b{font-weight:600;color:var(--ink)}

/* Empresas na tela inicial */
.grade-empresas{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.cartao-empresa{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:18px;display:flex;flex-direction:column;gap:14px;text-decoration:none;box-shadow:var(--sombra-1);transition:box-shadow .18s,transform .18s,border-color .18s;min-width:0}
.cartao-empresa:hover{box-shadow:var(--sombra-2);transform:translateY(-2px);border-color:var(--line-2)}
.ce-topo{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.ce-topo > div{min-width:0}
.ce-nome{font-family:var(--f-titulo);font-weight:600;font-size:18px;line-height:1.25;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ce-numeros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:12px;color:var(--muted)}
.ce-numeros b{display:block;font-family:var(--f-titulo);font-size:18px;color:var(--ink);font-weight:600}
.ce-numeros .horas b{color:var(--st-resolvido)}
.ce-rodape{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px}
.anel-rotulo{position:relative;display:grid;place-items:center;flex:none}
.anel-rotulo span{position:absolute;font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--ink)}
.nova-empresa{border:1px dashed var(--line-2);border-radius:var(--raio);display:flex;align-items:center;justify-content:center;gap:8px;min-height:150px;color:var(--muted);background:transparent;cursor:pointer;font-weight:600}
.nova-empresa:hover{color:var(--ink);border-color:var(--ink);background:var(--surface)}

/* Movimentos e horas por empresa */
.feed{display:flex;flex-direction:column}
.mov{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.mov:last-child{border-bottom:0}
.mov:hover{background:var(--surface-2)}
.mov .ponto{width:8px;height:8px;border-radius:50%;background:var(--cor);margin-top:7px;grid-row:1/3}
.mov .o-que{font-size:13.5px;min-width:0}
.mov .o-que b{font-weight:600}
.mov .quando{font-size:12px;color:var(--faint)}
.grafico-horas{display:flex;flex-direction:column;gap:12px;padding:18px}
.gh-linha{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px;text-decoration:none}
.gh-linha span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh-trilho{height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.gh-trilho i{display:block;height:100%;border-radius:5px;background:var(--st-resolvido)}
.gh-linha b{font-family:var(--f-mono);font-size:12px;font-weight:500}

/* ---------- Empresa ---------- */
.resumo-empresa{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,1.6fr);gap:14px}
@media (max-width:1180px){.resumo-empresa{grid-template-columns:repeat(3,minmax(0,1fr))}.resumo-empresa .kpi-etapas{grid-column:1/-1}}
@media (max-width:600px){.resumo-empresa{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.resumo-empresa .horas-destaque{grid-column:1/-1}}
.kpi.horas-destaque .kpi-num{color:var(--st-resolvido)}
.kpi-etapas{gap:12px}
.barra-ferramentas{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:space-between}
.vistas{display:inline-flex;padding:3px;border-radius:9px;background:var(--surface-3);gap:2px}
.vistas button{border:0;background:transparent;padding:7px 14px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.vistas button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sombra-1)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{appearance:none;border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.chip:hover{color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.busca-quadro{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:8px;padding:0 10px;background:var(--surface);min-width:0;flex:0 1 240px}
.busca-quadro input{border:0;background:transparent;padding:8px 0;outline:none;min-width:0;width:100%;font-size:13.5px}
.busca-quadro:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
@media (max-width:600px){.busca-quadro{flex:1 1 100%}}

/* Quadro de gargalos */
.quadro{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:12px;overflow-x:auto;padding:2px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
@media (max-width:1000px){.quadro{grid-auto-columns:minmax(258px,82vw)}}
.coluna{display:flex;flex-direction:column;min-width:0;border-radius:var(--raio);background:var(--surface-3);scroll-snap-align:start;transition:opacity .2s, box-shadow .15s}
.coluna.apagada{opacity:.38}
.coluna-cab{display:flex;align-items:center;gap:8px;padding:12px 12px 8px;font-weight:600;font-size:13px}
.coluna-cab i{width:9px;height:9px;border-radius:50%;background:var(--cor)}
.coluna-cab .conta{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;font-weight:500;color:var(--muted);background:var(--surface);padding:1px 7px;border-radius:999px}
.coluna-cab::after{content:"";position:absolute}
.coluna-topo{height:3px;border-radius:var(--raio) var(--raio) 0 0;background:var(--cor)}
.coluna-corpo{display:flex;flex-direction:column;gap:8px;padding:4px 8px 10px;min-height:140px;flex:1;border-radius:0 0 var(--raio) var(--raio);transition:background .15s}
.coluna.alvo .coluna-corpo{background:var(--cor-soft);box-shadow:inset 0 0 0 2px var(--cor)}
.coluna-vazia{font-size:12.5px;color:var(--faint);text-align:center;padding:18px 6px;border:1px dashed var(--line-2);border-radius:8px}
.add-coluna{border:0;background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px;border-radius:8px;cursor:pointer;text-align:left;display:flex;gap:6px;align-items:center}
.add-coluna:hover{background:var(--surface);color:var(--ink)}
.cartao-g{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;box-shadow:var(--sombra-1);transition:box-shadow .15s,transform .15s,border-color .15s;text-align:left;width:100%;position:relative}
.cartao-g:hover{box-shadow:var(--sombra-2);border-color:var(--line-2);transform:translateY(-1px)}
.cartao-g.arrastando{opacity:.4;transform:rotate(1.5deg)}
.cartao-g[draggable="true"]{cursor:grab}
.cg-topo{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cg-setor{font-family:var(--f-mono);font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.cg-titulo{font-weight:600;font-size:13.5px;line-height:1.35}
.cg-rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.cg-prox{display:inline-flex;align-items:flex-start;gap:4px;color:var(--cor);font-weight:600;min-width:0}
.cg-prox span{line-height:1.3}
.cg-marcas{display:inline-flex;gap:4px;color:var(--faint)}
.cg-marcas .ic svg{width:14px;height:14px}
.selo-horas{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--st-resolvido-soft);color:var(--st-resolvido);font-weight:700;font-size:11.5px;white-space:nowrap}
.selo-horas .ic svg{width:12px;height:12px}

/* Setores */
.grade-setores{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.cartao-setor{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:16px;display:flex;flex-direction:column;gap:12px;text-decoration:none;box-shadow:var(--sombra-1);transition:box-shadow .18s,transform .18s;min-width:0}
.cartao-setor:hover{box-shadow:var(--sombra-2);transform:translateY(-2px)}
.cs-topo{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cs-numeros{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.cs-numeros b{color:var(--ink);font-weight:600;font-size:14px}
.cs-horas{font-size:12.5px;color:var(--st-resolvido);font-weight:600}
.novo-setor{border:1px dashed var(--line-2);border-radius:var(--raio);display:flex;align-items:center;justify-content:center;gap:8px;min-height:126px;color:var(--muted);background:transparent;cursor:pointer;font-weight:600}
.novo-setor:hover{color:var(--ink);border-color:var(--ink);background:var(--surface)}
.remoto{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:center;justify-content:space-between;padding:16px 18px}
.remoto p{max-width:70ch}

/* Página do setor */
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:24px;align-items:start}
@media (max-width:960px){.duas{grid-template-columns:minmax(0,1fr)}}
.passo-titulo{display:flex;gap:10px;align-items:center}
.passo-titulo .n{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;background:var(--ink);color:var(--surface);font-family:var(--f-mono);font-size:12px;font-weight:500;flex:none}
.notas{display:flex;flex-direction:column;gap:10px}
.nota{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:13px 15px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--sombra-1)}
.nota-cab{display:flex;justify-content:space-between;align-items:center;gap:8px}
.nota-data{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.nota-texto{white-space:pre-wrap;font-size:14px;overflow-wrap:anywhere}
.cta-ia{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px;border-radius:var(--raio);background:var(--accent-soft);border:1px solid var(--line)}
.cta-ia p{font-size:13.5px;max-width:46ch}
.lista-g{display:flex;flex-direction:column;gap:8px}
.lista-g .cartao-g{flex-direction:row;align-items:center;gap:12px}
.lista-g .cartao-g .corpo{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}

/* ---------- Painel lateral do gargalo ---------- */
dialog{color:var(--ink)}
.gaveta{margin:0 0 0 auto;padding:0;border:0;width:min(580px,100vw);height:100dvh;max-height:100dvh;max-width:100vw;background:var(--surface);box-shadow:var(--sombra-3);border-left:1px solid var(--line)}
.gaveta[open]{display:flex;flex-direction:column;animation:deslizar .24s cubic-bezier(.2,.8,.2,1)}
.gaveta::backdrop{background:var(--veu);animation:esmaecer .2s ease}
@keyframes deslizar{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes esmaecer{from{opacity:0}to{opacity:1}}
.gv-cab{padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) 16px 22px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;background:var(--surface)}
.gv-linha{display:flex;justify-content:space-between;align-items:center;gap:10px}
.gv-cab h2{font-size:22px}
.gv-onde{font-size:13px;color:var(--muted)}
.gv-onde a{text-decoration:none}
.gv-onde a:hover{text-decoration:underline}
.gv-corpo{flex:1;overflow-y:auto;padding:20px max(22px,env(safe-area-inset-right,0px)) 28px 22px;display:flex;flex-direction:column;gap:22px}
.gv-rodape{padding:12px max(22px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) 22px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;background:var(--surface-2)}
.gv-rodape .dir{margin-left:auto;display:flex;gap:8px}
.etapas-passos{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.ep{border:0;background:transparent;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:left;min-width:0}
.ep i{height:5px;border-radius:3px;background:var(--surface-3);transition:background .2s}
.ep span{font-size:11.5px;font-weight:600;color:var(--faint);line-height:1.2;overflow-wrap:anywhere}
.ep.feito i{background:var(--cor)}
.ep.feito span{color:var(--muted)}
.ep.atual i{background:var(--cor)}
.ep.atual span{color:var(--cor)}
.ep:hover span{color:var(--ink)}
.ep[disabled]{cursor:default}
@media (max-width:480px){.ep span{font-size:10px;overflow-wrap:normal}}
.prox-passo{border-radius:var(--raio);padding:14px 16px;background:var(--cor-soft);display:flex;flex-direction:column;gap:10px;border:1px solid var(--line)}
.prox-passo .rotulo{color:var(--cor)}
.prox-passo p{font-size:14.5px;font-weight:600}
.prox-passo .acoes{gap:8px}
.gv-sec{display:flex;flex-direction:column;gap:6px}
.gv-sec p.texto{font-size:14.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.sem{color:var(--muted);font-style:italic}
.horas-edit{border:1px solid var(--line);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.horas-campos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.horas-campos label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.horas-campos input{padding:9px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-family:var(--f-mono);font-size:15px;width:100%}
.horas-campos input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.horas-resultado{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.horas-resultado b{font-family:var(--f-titulo);font-size:26px;color:var(--st-resolvido)}
.horas-resultado span{font-size:13px;color:var(--muted)}
.movs{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:4px}
.movs div{position:relative;padding:3px 0 10px 16px;font-size:13px}
.movs div::before{content:"";position:absolute;left:-5px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2)}
.movs div:first-child::before{border-color:var(--accent);background:var(--accent)}
.movs small{color:var(--faint);margin-left:6px}

/* ---------- Janela (formulários) ---------- */
.dlg{border:0;padding:0;border-radius:14px;background:var(--surface);width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:var(--sombra-3)}
.dlg.largo{width:min(880px,calc(100vw - 24px))}
.dlg[open]{animation:surgir .18s ease-out}
.dlg::backdrop{background:var(--veu)}
@keyframes surgir{from{transform:translateY(8px) scale(.985);opacity:0}to{transform:none;opacity:1}}
.dlg-form{display:flex;flex-direction:column;max-height:calc(100dvh - 24px)}
.dlg-cab{padding:20px 22px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dlg-cab p{color:var(--muted);font-size:13.5px;margin-top:4px}
.dlg-corpo{padding:18px 22px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
.dlg-rodape{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 14px 14px}
.dlg-rodape .dir{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo.largo{grid-column:1/-1}
.campo label{font-weight:600;font-size:13px}
.campo-linha{display:flex;justify-content:space-between;align-items:center;gap:8px}
.campo .ajuda{color:var(--muted);font-size:12.5px}
.campo .ajuda b{color:var(--ink);font-weight:600}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.campo textarea{resize:vertical;min-height:90px;line-height:1.5}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
textarea.prompt{font-family:var(--f-mono);font-size:12.6px;line-height:1.6;min-height:46vh;background:var(--surface-2)}
.erro-form{grid-column:1/-1;color:var(--bad);font-weight:600;font-size:13.5px}
@media (max-width:600px){.dlg-corpo{grid-template-columns:minmax(0,1fr)}}
.sugestao{grid-column:1/-1;border:1px solid var(--line);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.sugestao p{font-size:14px}
.sugestao-rodape{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.pensando{grid-column:1/-1;display:flex;gap:10px;align-items:center;color:var(--muted);padding:12px 0}
.pensando i{width:10px;height:10px;border-radius:2px;background:var(--accent);animation:pulsar 1s ease-in-out infinite}
@keyframes pulsar{50%{opacity:.25;transform:scale(.75)}}
.slides{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.slide{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;min-height:150px}
.slide-topo{padding:10px 12px 8px;display:flex;flex-direction:column;gap:3px;background:var(--surface-2);border-bottom:3px solid var(--accent)}
.slide.escuro .slide-topo{background:var(--navy);color:var(--navy-ink)}
.slide-n{font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink)}
.slide.escuro .slide-n{color:var(--accent-2)}
.slide-titulo{font-family:var(--f-titulo);font-weight:600;font-size:14px;line-height:1.3}
.slide ul{margin:0;padding:10px 12px 12px 26px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.links-setor{display:flex;flex-direction:column;grid-column:1/-1}
.link-setor{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.link-setor:last-child{border-bottom:0}
.previa-colar{grid-column:1/-1;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14px;display:flex;flex-direction:column;gap:4px;background:var(--surface-2)}

/* Busca rápida */
.paleta{border:0;padding:0;border-radius:14px;background:var(--surface);width:min(620px,calc(100vw - 24px));margin-top:12vh;box-shadow:var(--sombra-3);overflow:hidden}
.paleta[open]{animation:surgir .15s ease-out}
.paleta::backdrop{background:var(--veu)}
.paleta-busca{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.paleta-busca input{border:0;outline:none;background:transparent;font-size:16px;flex:1;min-width:0}
.paleta-lista{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
.paleta-grupo{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:10px 10px 4px}
.paleta-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.paleta-item .t{font-weight:600;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.paleta-item .d{font-size:12.5px;color:var(--muted);margin-left:auto;white-space:nowrap}
.paleta-item.sel,.paleta-item:hover{background:var(--surface-3)}
.paleta-rodape{padding:9px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;gap:14px;background:var(--surface-2)}
.paleta-rodape kbd{font-family:var(--f-mono);font-size:10.5px;padding:0 5px;border:1px solid var(--line-2);border-radius:4px;color:var(--muted)}

/* Ajustes */
.duas-iguais{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:900px){.duas-iguais{grid-template-columns:minmax(0,1fr)}}
.painel-corpo h2{margin-bottom:12px}
.dados{display:grid;grid-template-columns:minmax(140px,max-content) minmax(0,1fr);gap:10px 20px;font-size:14px;margin:0}
.dados dt{color:var(--muted)}
.dados dd{margin:0;overflow-wrap:anywhere}

/* ===== Telas simples: destaque do início, cartões de gargalo que abrem no lugar ===== */
.hero{position:relative;overflow:hidden;background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:28px 30px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;box-shadow:var(--sombra-2)}
.hero::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.hero .rotulo{color:var(--navy-muted)}
.hero-num{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.hero .grande{display:flex;align-items:baseline;gap:10px;font-family:var(--f-titulo);line-height:1}
.hero .grande b{font-size:clamp(54px,9vw,84px);font-weight:600;color:var(--accent-2);letter-spacing:-.02em}
.hero .grande small{font-size:20px;color:var(--navy-ink)}
.hero-sub{color:var(--navy-muted);font-size:14.5px;max-width:52ch}
.hero-torre{width:150px;height:150px;color:var(--navy-2);flex:none;margin:-10px -6px -34px 0;opacity:.9}
.hero-torre path{fill:currentColor}
@media (max-width:600px){.hero{padding:22px 20px}.hero-torre{display:none}}
.resumo-duplo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:640px){.resumo-duplo{grid-template-columns:minmax(0,1fr)}}
.legenda-etapas span.item{display:inline-flex;align-items:center;gap:6px}
.legenda-etapas span.item i{width:9px;height:9px;border-radius:2px;background:var(--cor)}
.q-lista{display:flex;flex-direction:column;width:100%}
.q-linha{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.q-linha b{font-weight:600}
.remoto .q-acoes{display:flex;gap:8px;flex-wrap:wrap;width:100%;justify-content:flex-end}
/* O que eu vi: caixa para escrever direto na tela */
.compositor{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--raio);box-shadow:var(--sombra-1);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.compositor:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.compositor textarea{width:100%;border:0;outline:none;background:transparent;padding:13px 15px;resize:none;min-height:84px;font-size:14.5px;line-height:1.5;display:block}
.compositor-rodape{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px 8px 15px;border-top:1px solid var(--line);background:var(--surface-2)}
.nota textarea{width:100%;border:1px solid var(--line-2);border-radius:8px;padding:10px 12px;font-size:14px;line-height:1.5;resize:vertical;min-height:110px;background:var(--surface)}
.nota-edicao{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.nota-edicao .perigo{margin-right:auto}
.sugestoes{border:1px solid var(--accent);border-radius:var(--raio);background:var(--accent-soft);padding:14px;display:flex;flex-direction:column;gap:10px;animation:surgir .2s ease-out}
.sugestoes-cab{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sugestoes .sugestao{background:var(--surface)}
.sugestoes .pensando{padding:6px 0}
/* Gargalo: cartão que abre e fecha no próprio lugar */
.lista-gargalos{display:flex;flex-direction:column;gap:10px}
.novo-g{display:flex;gap:8px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--raio);padding:6px 6px 6px 14px;align-items:center;transition:border-color .15s}
.novo-g:focus-within{border-style:solid;border-color:var(--accent)}
.novo-g .ic{color:var(--faint)}
.novo-g input{flex:1;min-width:0;border:0;outline:none;background:transparent;font-size:14.5px;padding:7px 0}
.g-card{position:relative;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cor);border-radius:var(--raio);box-shadow:var(--sombra-1);transition:box-shadow .18s,transform .18s}
.g-card:not(.aberto):hover{box-shadow:var(--sombra-2);transform:translateY(-1px)}
.g-card.aberto{box-shadow:var(--sombra-2)}
.g-topo{display:grid;grid-template-columns:minmax(0,1fr) auto 18px;gap:6px 12px;align-items:center;width:100%;border:0;background:none;text-align:left;padding:14px 14px 14px 16px;cursor:pointer;border-radius:var(--raio)}
.g-titulo{font-weight:600;font-size:15px;line-height:1.3}
.g-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.g-seta{color:var(--faint);transition:transform .2s;display:grid;place-items:center;transform:rotate(90deg)}
.g-card.aberto .g-seta{transform:rotate(-90deg)}
.trilha-mini{grid-column:1/-1;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.trilha-mini i{height:4px;border-radius:2px;background:var(--surface-3)}
.trilha-mini i.on{background:var(--cor)}
.g-corpo{padding:4px 16px 16px;display:flex;flex-direction:column;gap:16px;animation:abrir .22s ease-out}
@keyframes abrir{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.trilha{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:relative}
.trilha::before{content:"";position:absolute;left:10%;right:10%;top:15px;height:2px;background:var(--line)}
.passo-t{position:relative;border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;min-width:0;color:var(--faint)}
.passo-t i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:500;transition:transform .15s,background .2s,border-color .2s;z-index:1}
.passo-t i .ic svg{width:14px;height:14px;stroke-width:2.4}
.passo-t span{font-size:11.5px;font-weight:600;text-align:center;line-height:1.2}
.passo-t:hover i{transform:scale(1.08);border-color:var(--cor)}
.passo-t.feito i{background:var(--cor-soft);border-color:var(--cor);color:var(--cor)}
.passo-t.feito span{color:var(--muted)}
.passo-t.atual i{background:var(--cor);border-color:var(--cor);color:#fff;box-shadow:0 0 0 5px var(--cor-soft)}
.passo-t.atual span{color:var(--ink)}
.passo-t[disabled]{cursor:default}
.passo-t[disabled]:hover i{transform:none}
@media (max-width:480px){.passo-t span{font-size:10px}.passo-t i{width:28px;height:28px}.trilha::before{top:13px}}
.g-campo{display:flex;flex-direction:column;gap:6px}
.g-campo textarea,.g-campo input{width:100%;border:1px solid transparent;border-radius:8px;background:var(--surface-2);padding:9px 11px;font-size:14.5px;line-height:1.5;resize:none;transition:border-color .15s,background .15s;overflow:hidden}
.g-campo input.titulo{font-weight:600;font-size:15.5px}
.g-campo textarea:hover,.g-campo input:hover{border-color:var(--line-2)}
.g-campo textarea:focus,.g-campo input:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft)}
.g-campo .campo-linha .rotulo{margin:0}
.horas-inline{border:1px solid var(--st-resolvido);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:12px;background:var(--st-resolvido-soft)}
.horas-inline .rotulo{color:var(--st-resolvido)}
.horas-inline .linha{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.horas-inline .horas-campos{flex:1;min-width:220px}
.g-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:4px;border-top:1px solid var(--line);padding-top:14px}
.g-acoes .dir{margin-left:auto}
.girando{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:girar .7s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
/* Festa quando um gargalo é resolvido com as horas */
.festa{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:var(--raio);z-index:3}
.festa i{position:absolute;top:-12px;width:8px;height:12px;border-radius:2px;opacity:0;animation:confete 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes confete{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(260px) rotate(540deg)}}
.festa b{position:absolute;left:50%;top:auto;bottom:96px;transform:translate(-50%,-50%) scale(.6);background:var(--st-resolvido);color:#fff;font-family:var(--f-titulo);font-size:24px;padding:10px 18px;border-radius:999px;box-shadow:var(--sombra-3);white-space:nowrap;opacity:0;animation:bolha 2.4s ease forwards}
@keyframes bolha{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.06)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}

/* ===== Saúde dos setores e diagnóstico ===== */
.s-critico{--cor:var(--bad);--cor-soft:var(--bad-soft)}
.cartao-setor.com-saude{border-top:3px solid var(--cor)}
.cartao-setor .pill{flex:none}
.cs-diag{font-size:13.5px;font-weight:600;color:var(--cor)}
.cartao-setor.s-aberto .cs-diag{color:var(--muted);font-weight:500}
.saude{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--cor);border-radius:var(--raio);box-shadow:var(--sombra-1);padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.saude-cab{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.saude-titulo{display:flex;flex-direction:column;gap:4px}
.saude-status{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-titulo);font-size:26px;font-weight:600;color:var(--cor);line-height:1.1}
.saude.s-aberto .saude-status{color:var(--muted)}
.saude-status i{width:14px;height:14px;border-radius:50%;background:var(--cor);box-shadow:0 0 0 5px var(--cor-soft)}
.indicadores{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.ind{background:var(--surface-2);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ind b{font-family:var(--f-titulo);font-size:22px;font-weight:600;line-height:1.1;color:var(--ink)}
.ind span{font-size:12px;color:var(--muted);line-height:1.25}
.ind.s-critico b,.ind.s-execucao b,.ind.s-resolvido b{color:var(--cor)}
@media (max-width:760px){.indicadores{grid-template-columns:repeat(2,minmax(0,1fr))}.indicadores .ind:last-child{grid-column:1/-1}}
.problemas{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.problemas li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.problemas li .pill{flex:none;margin-top:1px}
.problemas small{display:block;color:var(--muted);font-size:12.5px}
.diag{display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--line);padding-top:14px;animation:abrir .22s ease-out}
.diag-topo{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:13px;font-weight:600}
.diag-topo select{padding:7px 10px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface);font-weight:600}
.diag-topo .meta{font-weight:400;margin-left:auto}
.pergunta{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.pergunta:last-child{border-bottom:0}
.pergunta-n{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--surface-3);font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.pergunta.r-sim .pergunta-n{background:var(--st-resolvido);color:#fff}
.pergunta.r-parte .pergunta-n{background:var(--st-execucao);color:#fff}
.pergunta.r-nao .pergunta-n{background:var(--bad);color:#fff}
.pergunta-corpo{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}
.pergunta-corpo p{font-size:14.5px;font-weight:500}
.respostas{display:flex;gap:6px;flex-wrap:wrap}
.resp{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);transition:transform .12s,background .15s}
.resp:hover{transform:translateY(-1px)}
.resp-sim[aria-pressed="true"]{background:var(--st-resolvido);border-color:var(--st-resolvido);color:#fff}
.resp-parte[aria-pressed="true"]{background:var(--st-execucao);border-color:var(--st-execucao);color:#fff}
.resp-nao[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.resp[disabled]{cursor:default}
.evidencia{width:100%;padding:8px 11px;border-radius:7px;border:1px solid var(--line-2);background:var(--surface-2);font-size:13.5px}
.evidencia:focus{outline:none;border-color:var(--accent);background:var(--surface)}
/* Foto e áudio na anotação */
.comp-botoes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.comp-botoes label.btn{cursor:pointer}
.anexos-novos{display:flex;gap:8px;flex-wrap:wrap;padding:0 15px 12px}
.fotos{display:flex;gap:8px;flex-wrap:wrap}
.foto{position:relative;display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:var(--surface-2);cursor:pointer;width:92px;height:92px;flex:none}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
.foto button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;cursor:pointer;line-height:1;font-size:15px}
.audio-novo,.audio-nota{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;color:var(--accent-ink);max-width:100%}
.audio-novo audio,.audio-nota audio{height:34px;max-width:240px;min-width:0}
.audio-nota{align-self:flex-start}
.foto-grande{max-width:100%;max-height:72vh;border-radius:8px;display:block;margin:0 auto}

/* ===== Abas de página, check-up, biblioteca e Intelligence ===== */
.abas{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-6px}
.abas::-webkit-scrollbar{display:none}
.aba{display:inline-flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;border-radius:8px 8px 0 0;transition:color .15s,background .15s}
