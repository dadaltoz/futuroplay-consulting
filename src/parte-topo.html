.aba.ativa .conta{background:var(--accent-soft);color:var(--accent-ink)}
/* No celular as quatro abas do setor não cabem numa linha: viram duas linhas, todas à vista */
@media (max-width:560px){.abas:has(> .aba:nth-child(4)){display:grid;grid-template-columns:1fr 1fr;gap:0}.abas:has(> .aba:nth-child(4)) .aba{justify-content:center;padding:10px 8px}}
.lado-nota{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--navy-muted)}
.anel-nota{position:relative;display:inline-grid;place-items:center;width:var(--tam);height:var(--tam);flex:none}
.anel-nota .anel{position:absolute;inset:0;width:100%;height:100%}
.conteudo .anel-nota .anel .valor{stroke:var(--cor,var(--accent))}
.anel-nota.neutro{--cor:var(--accent)}
.anel-nota b{font-family:var(--f-titulo);font-weight:600;font-size:calc(var(--tam) * .34);line-height:1;color:var(--ink)}
.anel-nota.claro{--cor:var(--accent-2)}
.conteudo .anel-nota.claro .anel .trilho{stroke:var(--navy-3)}
.anel-nota.claro b{color:#fff}
.barra-nota{display:block;height:10px;border-radius:5px;background:var(--surface-3);overflow:hidden;min-width:60px}
.barra-nota i{display:block;height:100%;border-radius:5px;background:var(--cor,var(--accent));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.barra-nota.neutro i{background:var(--accent)}
.resumo-tres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:860px){.resumo-tres{grid-template-columns:minmax(0,1fr)}}
.kpi-link{text-decoration:none;color:inherit;transition:box-shadow .15s,transform .15s}
.kpi-link:hover{box-shadow:var(--sombra-2);transform:translateY(-1px)}
.kpi-link .kpi-linha{justify-content:flex-start;gap:14px}
.cartao-setor .cs-diag{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cab > div.cab-setor{flex-direction:row;align-items:center;gap:16px}
.cab-setor > div{display:flex;flex-direction:column;gap:7px;min-width:0}
.cab-setor .pill{vertical-align:middle;margin-right:6px}
.checkup-topo{background:var(--navy);color:var(--navy-ink);border-radius:16px;padding:24px 26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;position:relative;overflow:hidden;box-shadow:var(--sombra-2)}
.checkup-topo::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.ck-nota{display:flex;gap:22px;align-items:center}
.ck-nota h2{font-size:28px;color:#fff;margin:4px 0}
.ck-nota p{color:var(--navy-muted);font-size:14px;max-width:52ch}
.ck-nota .rotulo{color:var(--navy-muted)}
@media (max-width:600px){.ck-nota{flex-direction:column;align-items:flex-start}}
.mapa-notas{display:flex;flex-direction:column;overflow:hidden}
.mn-linha{display:grid;grid-template-columns:minmax(110px,190px) minmax(0,1fr) 34px auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.mn-linha:last-child{border-bottom:0}
.mn-linha:hover{background:var(--surface-2)}
.mn-nome{display:flex;flex-direction:column;min-width:0}
.mn-nome b,.mn-nome .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mn-num{font-family:var(--f-titulo);font-size:18px;text-align:right;color:var(--cor)}
@media (max-width:600px){.mn-linha{grid-template-columns:minmax(0,1fr) 34px auto}.mn-linha .barra-nota{grid-column:1/-1;grid-row:2}}
.eixos{display:flex;flex-direction:column;gap:12px}
.bloco > .eixos{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:16px 18px;box-shadow:var(--sombra-1)}
.eixo{display:grid;grid-template-columns:minmax(130px,190px) minmax(0,1fr) 34px;gap:12px;align-items:center;font-size:13.5px}
.eixo b{font-family:var(--f-titulo);font-size:17px;text-align:right}
@media (max-width:520px){.eixo{grid-template-columns:minmax(0,1fr) 34px}.eixo .barra-nota{grid-column:1/-1;grid-row:2}}
.oportunidades{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:op}
.oportunidades li a{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--cor);border-radius:var(--raio);padding:12px 14px;text-decoration:none;color:inherit;box-shadow:var(--sombra-1);transition:transform .15s}
.oportunidades li a:hover{transform:translateX(2px)}
.oportunidades .pill{flex:none;margin-top:1px}
.op-txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.op-txt b{font-weight:600;font-size:14.5px}
.como-ler{max-width:90ch}
.grupos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:900px){.grupos{grid-template-columns:minmax(0,1fr)}}
.grupo-criterios{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:6px 16px 4px;box-shadow:var(--sombra-1)}
.grupo-criterios h3{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);padding:10px 0 4px}
.coluna-unica{display:flex;flex-direction:column;gap:14px;max-width:860px;width:100%}
.linha-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.linha-acoes .novo-g{flex:1;min-width:240px}
.indicadores.tres{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.indicadores.tres{grid-template-columns:repeat(3,minmax(0,1fr))}.indicadores.tres .ind:last-child{grid-column:auto}}
.bib-lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
.bib-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--raio);padding:14px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--sombra-1);transition:box-shadow .15s}
.bib-card:hover,.bib-card.aberto{box-shadow:var(--sombra-2)}
.bib-card.aberto{grid-column:1/-1}
.bib-card p{font-size:13.5px;white-space:pre-wrap}
.bib-topo{border:0;background:none;padding:0;text-align:left;cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.bib-topo h3{width:100%;font-size:16px;margin-top:2px}
.tag.caso{background:var(--st-resolvido-soft);color:var(--st-resolvido)}
.bib-acoes{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.bib-acoes .dir{margin-left:auto}
.ia-ctx{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.ia-selects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ia-selects label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted)}
.ia-selects select{padding:9px 10px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:14px;color:var(--ink)}
@media (max-width:720px){.ia-selects{grid-template-columns:minmax(0,1fr)}}
.ia-rapidas{display:flex;gap:8px;flex-wrap:wrap}
.chat{display:flex;flex-direction:column;gap:12px}
.msg{max-width:min(760px,100%);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:6px;animation:surgir .2s ease-out}
.msg p{white-space:pre-wrap;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.msg.voce{align-self:flex-end;background:var(--navy);color:var(--navy-ink);border-bottom-right-radius:4px}
.msg.ia{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px;box-shadow:var(--sombra-1)}
.msg.ia .rotulo{color:var(--accent-ink)}
.msg-acoes{display:flex;gap:6px;flex-wrap:wrap;padding-top:6px;border-top:1px solid var(--line)}
.ia-caixa{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--raio);box-shadow:var(--sombra-2);position:sticky;bottom:12px;overflow:hidden}
.ia-caixa:focus-within{border-color:var(--accent)}
@media (max-width:700px){.ia-caixa{position:static}}
.ia-caixa textarea{width:100%;border:0;outline:none;background:transparent;padding:13px 15px;resize:none;font-size:14.5px;display:block}
.ia-caixa-rodape{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid var(--line);background:var(--surface-2)}
.mat-form{display:flex;flex-direction:column;gap:12px}
.mat-form h2{margin-bottom:0}
.mat-form input[type=text],.mat-form textarea{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-size:14px}
.mat-trecho{color:var(--muted);font-size:13px}
.nota-cab .dir{display:flex;gap:8px;align-items:center}

/* Oportunidade: o "poderia ter" do setor, em azul para não confundir com problema */
.g-card.oport{border-left-style:dashed}
.tag.oport{background:var(--st-apresentado-soft);color:var(--st-apresentado)}
.sugestao .tag{align-self:flex-start}

/* Resposta da RF Intelligence: resposta direta em destaque, blocos curtos, etiquetas e gráficos */
.msg.ia{width:min(760px,100%)}
.resposta{display:flex;flex-direction:column;gap:10px;font-size:14.5px;line-height:1.55;overflow-wrap:anywhere}
.resposta p{margin:0;white-space:normal}
.resposta .r-direta{font-family:var(--f-titulo);font-size:18px;font-weight:600;line-height:1.35;color:var(--ink);padding:2px 0 4px}
.resposta .r-titulo{margin:6px 0 -2px;font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink)}
.r-lista{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.r-lista li{position:relative;padding:8px 12px 8px 30px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px}
ul.r-lista li::before{content:"";position:absolute;left:13px;top:16px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
ul.r-lista li:has(> .r-tag:first-child){padding-left:12px}
ul.r-lista li:has(> .r-tag:first-child)::before{display:none}
ol.r-lista{counter-reset:passo}
ol.r-lista li{counter-increment:passo;padding-left:40px}
ol.r-lista li::before{content:counter(passo);position:absolute;left:10px;top:8px;width:21px;height:21px;border-radius:50%;background:var(--navy);color:var(--navy-ink);font:600 11.5px/21px var(--f-mono);text-align:center}
.r-tag{display:inline-block;margin-right:7px;padding:1px 7px;border-radius:999px;font:600 10.5px/1.6 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;vertical-align:1px}
.r-fato{background:var(--st-resolvido-soft);color:var(--st-resolvido)}
.r-provavel{background:var(--st-execucao-soft);color:var(--st-execucao)}
.r-atencao{background:var(--bad-soft);color:var(--bad)}
.r-confirmar{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;border-radius:9px;background:var(--st-apresentado-soft);color:var(--ink)}
.r-confirmar .ic{color:var(--st-apresentado);margin-top:2px}
.r-tabela{overflow-x:auto;border:1px solid var(--line);border-radius:9px}
.r-tabela table{border-collapse:collapse;width:100%;font-size:13.5px}
.r-tabela th{background:var(--surface-3);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap}
.r-tabela td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.grafico{margin:2px 0;padding:14px 14px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);display:flex;flex-direction:column;gap:9px}
.grafico.montando{flex-direction:row;align-items:center;gap:8px;color:var(--muted);font-size:13.5px}
.gr-titulo{font-weight:600;font-size:14px}
.gr-legenda{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.gr-legenda i{width:10px;height:10px;border-radius:3px;margin-left:6px}
.gr-legenda i:first-child{margin-left:0}
.gr-linha{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px}
.gr-linha.cheia{grid-template-columns:minmax(90px,30%) minmax(0,1fr) auto}
.gr-rot{font-size:13px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-trilho{height:12px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.gr-trilho i{display:block;height:100%;border-radius:999px;background:var(--accent);animation:crescer .6s ease-out both}
.gr-trilho i.menor{background:var(--bad)}
.gr-trilho i.antes,.gr-legenda i.antes{background:var(--line-2)}
.gr-trilho i.depois,.gr-legenda i.depois{background:var(--st-resolvido)}
.gr-linha b{font:600 12.5px var(--f-mono);min-width:44px;text-align:right}
.gr-linha em{font:600 12px var(--f-mono);font-style:normal;color:var(--st-resolvido)}
.gr-par{display:flex;flex-direction:column;gap:4px;padding-top:2px}
@keyframes crescer{from{width:0}}
@media (prefers-reduced-motion:reduce){.gr-trilho i{animation:none}}
@media (max-width:560px){.gr-linha.cheia{grid-template-columns:1fr auto}.gr-linha.cheia .gr-rot{grid-column:1/-1}.gr-linha.cheia .gr-trilho{grid-column:1}}

/* ===== Campo 3D das empresas (Início) =====
   O desenho é sempre noturno, nos dois temas. Por cima dele, uma camada (HUD) com o título,
   a legenda e os botões; ela não pega o mouse, só os botões pegam. */
.campo3d{position:relative;height:max(520px,calc(100dvh - 126px));border-radius:20px;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 80% at 50% 0%,#16305a 0%,#0c1a31 45%,#0a1527 100%);border:1px solid #1d3558;box-shadow:0 24px 60px rgba(8,16,32,.28);color:#eef2f8}
.campo-palco{position:absolute;inset:0}
.campo-palco canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none;outline:none}
.campo-rotulos{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.campo-hud::before{content:"";position:absolute;left:0;right:0;top:0;height:210px;background:linear-gradient(rgba(10,22,44,.78),rgba(10,22,44,.38) 55%,rgba(10,22,44,0));pointer-events:none;z-index:-1;border-radius:inherit}
.ch-dica{background:rgba(10,22,44,.62);color:#dbe4f2 !important;padding:6px 10px;border-radius:999px;backdrop-filter:blur(6px)}
.campo-hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:22px 24px;z-index:2000}
.campo-hud button,.campo-hud a{pointer-events:auto}
.ch-topo{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.ch-titulo{display:flex;flex-direction:column;gap:6px;text-shadow:0 2px 18px rgba(5,10,20,.6)}
.ch-titulo .olho{color:#f3a66a}
.ch-titulo h1{color:#fff;font-size:clamp(26px,3.2vw,38px)}
.ch-titulo .sub{color:#a9b9d3}
.ch-acoes{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ch-chip{display:inline-flex;align-items:baseline;gap:6px;padding:9px 14px;border-radius:999px;background:rgba(12,24,46,.7);border:1px solid rgba(160,190,240,.22);backdrop-filter:blur(10px);font-size:13px;color:#c9d6ea}
.ch-chip b{font:600 18px var(--f-titulo);color:#5fe0a0}
.ch-vazio{align-self:center;pointer-events:auto;max-width:440px;text-align:center;padding:26px 28px;border-radius:18px;background:rgba(12,24,46,.78);border:1px solid rgba(160,190,240,.22);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:10px;align-items:center}
.ch-vazio h3{font-family:var(--f-titulo);font-size:22px;color:#fff;margin:0}
.ch-vazio p{color:#a9b9d3;margin:0 0 6px}
.ch-rodape{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.ch-legenda{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;max-width:720px;padding:10px 14px;border-radius:14px;background:rgba(12,24,46,.62);border:1px solid rgba(160,190,240,.16);backdrop-filter:blur(10px);font-size:12px;color:#c9d6ea}
.ch-legenda span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ch-legenda i{width:9px;height:9px;border-radius:3px;box-shadow:0 0 10px currentColor}
.ch-legenda i.losango{transform:rotate(45deg);border-radius:1px;width:8px;height:8px}
.ch-leg-tit{width:100%;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#8ea2c4}
.ch-dica{display:flex;align-items:center;gap:10px;font-size:12px;color:#8ea2c4}
.ch-dica .btn{background:rgba(12,24,46,.7);border-color:rgba(160,190,240,.25);color:#eef2f8;backdrop-filter:blur(10px)}
.so-toque{display:none}
@media (hover:none){.so-mouse{display:none}.so-toque{display:inline}}
/* Plaquinha de cada empresa, presa na ilha */
.pq{position:absolute;left:0;top:0;display:flex;flex-direction:column;gap:0;min-width:200px;max-width:280px;padding:8px;border-radius:14px;background:rgba(10,21,40,.78);border:1px solid rgba(160,190,240,.22);border-top:2px solid var(--saude);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#eef2f8;text-decoration:none;box-shadow:0 12px 32px rgba(0,0,0,.4),0 0 24px -6px var(--saude);pointer-events:auto;transform-origin:50% 100%;will-change:transform;transition:background .2s,border-color .2s}
.pq::after{content:"";position:absolute;left:50%;bottom:-16px;width:1px;height:16px;background:linear-gradient(var(--saude),transparent)}
.pq:hover,.pq.aberta{background:rgba(14,28,54,.92);border-color:rgba(190,210,250,.4)}
.pq-linha{display:flex;align-items:center;gap:10px}
.pq-logo{flex:none;width:40px;height:40px;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden}
.pq-logo img{max-width:86%;max-height:86%;object-fit:contain}
.pq-logo.sem{background:#23416f;color:#f3a66a;font:700 14px var(--f-mono);letter-spacing:.04em}
.pq-txt{display:flex;flex-direction:column;min-width:0;flex:1}
.pq-txt b{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq-txt small{font-size:11.5px;color:#a9b9d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pq-nota{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--f-mono);border:2px solid var(--saude);box-shadow:inset 0 0 12px -4px var(--saude)}
.pq-mais{display:none;flex-direction:column;gap:7px;padding:9px 4px 2px;margin-top:8px;border-top:1px solid rgba(160,190,240,.16)}
.pq.aberta .pq-mais{display:flex;animation:surgir .18s ease-out}
.pq-saude{align-self:flex-start;font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--saude)}
.pq-setores{display:flex;flex-direction:column;gap:3px}
.pq-setor{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#dbe4f2}
.pq-setor i{width:8px;height:8px;border-radius:2px;flex:none}
.pq-setor b{margin-left:auto;font:500 12px var(--f-mono);color:#a9b9d3}
.pq-setor.resto,.pq-vazio{color:#8ea2c4;font-size:12px}
.pq-num{font-size:11.5px;color:#a9b9d3;white-space:normal}
.pq-abrir{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;color:#f3a66a}
.pq-abrir .ic svg{width:14px;height:14px}
.pq-torre{position:absolute;left:0;top:0;pointer-events:none;padding:4px 10px;border-radius:999px;background:rgba(217,104,26,.16);border:1px solid rgba(243,166,106,.45);color:#f3c49a;font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
@media (max-width:700px){
  .campo3d{height:max(480px,calc(100dvh - 92px));border-radius:16px;margin-inline:-6px}
  .campo-hud{padding:16px 14px}
  .ch-titulo h1{font-size:24px}
  .ch-legenda{padding:8px 10px;gap:4px 10px;font-size:11px}
  .ch-leg-tit{display:none}
  .ch-dica span{display:none}
  .pq{min-width:170px;max-width:220px}
  .pq-logo{width:32px;height:32px}.pq-nota{width:32px;height:32px;font-size:12px}
}
/* ===== Modo apresentação (tela cheia, só a ilha do cliente) ===== */
body.apresentando{overflow:hidden}
.campo3d.apresentando{position:fixed;inset:0;z-index:5000;height:100dvh;border-radius:0;border:0;box-shadow:none}
.ap-camada{position:absolute;inset:0;z-index:2100;pointer-events:none;display:none}
.ap-camada.ligada{display:block}
.ap-camada button{pointer-events:auto}
.ap-progresso{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.08)}
.ap-progresso i{display:block;height:100%;width:0;background:linear-gradient(90deg,#d9681a,#ffb067);box-shadow:0 0 12px #ff8a3d}
.ap-legenda{position:absolute;left:clamp(16px,4vw,56px);bottom:clamp(84px,12vh,120px);max-width:min(560px,calc(100% - 32px))}
.ap-legenda.entra .ap-card{animation:apEntra .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes apEntra{from{opacity:0;transform:translateY(18px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.ap-card{display:flex;flex-direction:column;gap:14px;padding:24px 26px;border-radius:20px;background:rgba(8,17,34,.74);border:1px solid rgba(160,190,240,.2);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 30px 80px rgba(0,0,0,.45);color:#eef2f8}
.ap-olho{margin:0;font:600 11.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#f3a66a}
.ap-titulo{margin:0;font-family:var(--f-titulo);font-size:clamp(34px,5vw,58px);line-height:1.05;color:#fff}
.ap-titulo.menor{font-size:clamp(26px,3.4vw,38px)}
.ap-sub{margin:0;color:#b8c6dc;font-size:16px;line-height:1.5}
.ap-pe{margin:4px 0 0;color:#8ea2c4;font-size:13px}
.ap-logo{height:46px;width:auto;align-self:flex-start;filter:drop-shadow(0 4px 18px rgba(0,0,0,.4))}
.ap-linha{display:flex;align-items:center;gap:20px}
.ap-linha > div{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ap-anel{flex:none}
.ap-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ap-eixos{display:grid;gap:8px}
.ap-eixo{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;align-items:center;gap:10px;font-size:13.5px;color:#c9d6ea}
.ap-trilho{height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden}
.ap-trilho i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#d9681a,#ffb067);animation:crescer 1s .3s cubic-bezier(.2,.8,.2,1) both}
.ap-eixo b{font:600 13px var(--f-mono);text-align:right;color:#fff}
.ap-numeros{display:flex;flex-wrap:wrap;gap:8px 22px;padding-top:4px;border-top:1px solid rgba(160,190,240,.14)}
.ap-numeros span{display:flex;flex-direction:column;font-size:12.5px;color:#a9b9d3;padding-top:10px}
.ap-numeros b{font:600 26px var(--f-titulo);color:#fff}
.ap-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.ap-cols ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ap-cols li{position:relative;padding-left:18px;font-size:14.5px;line-height:1.4;color:#eef2f8}
.ap-cols li::before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;transform:rotate(45deg);border-radius:1px}
.ap-cols li.g::before{background:#f0523f;box-shadow:0 0 10px #f0523f}
.ap-cols li.o::before{background:#38bdf8;box-shadow:0 0 10px #38bdf8}
.ap-cols li.mais{color:#8ea2c4;padding-left:0}.ap-cols li.mais::before{display:none}
.ap-rot{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase}
.ap-rot.r{color:#ff8a7a}.ap-rot.o{color:#7fd3ff}
.ap-feito{display:flex;align-items:center;gap:8px;margin:0;color:#5fe0a0;font-weight:600;font-size:14px}
.ap-feito .ic svg{width:16px;height:16px}
.ap-final{align-items:flex-start}
.ap-grande{margin:0;display:flex;align-items:baseline;gap:12px;font-family:var(--f-titulo);line-height:1}
.ap-grande b{font-size:clamp(64px,10vw,112px);color:#5fe0a0;text-shadow:0 0 40px rgba(47,191,113,.45)}
.ap-grande small{font-size:clamp(18px,2.2vw,26px);color:#c9d6ea;font-weight:500}
.ap-fim{display:flex;gap:10px;margin-top:6px}
.ap-botao{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(160,190,240,.3);background:rgba(255,255,255,.06);color:#eef2f8;font-weight:600;cursor:pointer}
.ap-botao.primario{background:#d9681a;border-color:#d9681a;color:#fff}
.ap-controles{position:absolute;left:50%;bottom:clamp(18px,3vh,30px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;background:rgba(8,17,34,.72);border:1px solid rgba(160,190,240,.2);backdrop-filter:blur(12px)}
.ap-controles button{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#eef2f8;display:grid;place-items:center;cursor:pointer}
.ap-controles button:hover{background:rgba(255,255,255,.16)}
.ap-controles button[data-ap="ant"] .ic{transform:none}
.ap-controles button.pausado{background:#d9681a}
.ap-controles .ap-sair{width:auto;padding:0 16px;border-radius:999px;font-weight:600;font-size:13px}
.ap-pontos{display:flex;gap:5px;padding:0 6px}
.ap-pontos i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.22);transition:all .3s}
.ap-pontos i.feito{background:rgba(243,166,106,.6)}
.ap-pontos i.atual{width:22px;border-radius:999px;background:#ff8a3d;box-shadow:0 0 10px #ff8a3d}
.ap-camada.no-fim .ap-controles button[data-ap="pausa"]{display:none}
@media (max-width:700px){.ap-legenda{left:12px;right:12px;bottom:78px;max-width:none}.ap-card{padding:18px}.ap-eixo{grid-template-columns:110px 1fr 30px;font-size:12.5px}.ap-pontos{display:none}}
/* Texto da comemoração que sobe no campo */
.festa-campo{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 16px;border-radius:14px;background:rgba(10,30,24,.82);border:1px solid rgba(95,224,160,.55);box-shadow:0 0 40px -6px #2fbf71;color:#eafff3;white-space:nowrap;text-align:center}
.festa-campo b{font:600 20px var(--f-titulo);color:#5fe0a0}
.festa-campo small{font-size:12px;color:#bfe8d2;max-width:280px;overflow:hidden;text-overflow:ellipsis}
/* Botão Apresentar no Início (lista das empresas) */
.ch-apresentar{position:relative;pointer-events:auto}
.ch-apresentar summary{list-style:none;cursor:pointer;background:rgba(12,24,46,.7);border-color:rgba(160,190,240,.25);color:#eef2f8;backdrop-filter:blur(10px)}
.ch-apresentar summary::-webkit-details-marker{display:none}
.ch-lista{position:absolute;right:0;top:calc(100% + 8px);min-width:240px;display:flex;flex-direction:column;padding:8px;border-radius:14px;background:rgba(10,21,40,.95);border:1px solid rgba(160,190,240,.25);box-shadow:0 20px 50px rgba(0,0,0,.45);z-index:5}
.ch-lista-tit{padding:6px 10px 8px;font:600 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#8ea2c4}
.ch-lista a{padding:9px 10px;border-radius:9px;color:#eef2f8;text-decoration:none;font-size:14px}
.ch-lista a small{display:block;font-size:11.5px;color:#8ea2c4;margin-top:1px}
.ch-lista a:hover{background:rgba(255,255,255,.08)}

/* ===== Cano do setor (aba Gargalos) ===== */
.cano{border-radius:16px;padding:16px 18px 14px;background:radial-gradient(120% 140% at 50% 0%,#132a4d 0%,#0a1527 70%);border:1px solid #1d3558;color:#eef2f8;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.cano-topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cano-topo .rotulo{color:#8ea2c4}
.cano-resumo{font-size:13px;font-weight:600}
.cano-resumo.trava{color:#ff8a7a}.cano-resumo.livre{color:#5fe0a0}
.cano-palco{position:relative;height:74px}
.cano-palco canvas{display:block;width:100%;height:100%}
.cano-ponta{position:absolute;bottom:-2px;font:600 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:#6f84a8}
.cano-ponta.e{left:4px}.cano-ponta.s{right:4px}
.cano-rotulos{position:relative;height:40px}
.cano-rot{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:1px;max-width:150px;text-align:center}
.cano-rot b{font-size:12px;font-weight:600;line-height:1.25;color:#dbe4f2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cano-rot i{font:600 10px var(--f-mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase}
.cano-rot.trava i{color:#ff8a7a}.cano-rot.melhora i{color:#f0b429}.cano-rot.livre i{color:#5fe0a0}
@media (max-width:600px){.cano-rot b{display:none}.cano-rotulos{height:18px}}

/* ===== RF Intelligence por voz ===== */
.ia-caixa-rodape{gap:10px}
.ia-rodape-esq,.ia-rodape-dir{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ia-falar{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);cursor:pointer}
.ia-falar input{accent-color:var(--accent)}
.ia-mic{width:40px;padding:0;justify-content:center}
.voz-painel{display:flex;align-items:center;gap:16px;padding:14px 18px;margin:8px 8px 0;border-radius:14px;background:radial-gradient(120% 160% at 0% 50%,#16305a,#0a1527);border:1px solid #1d3558;color:#eef2f8;animation:surgir .25s ease-out}
.voz-painel[hidden]{display:none}
.voz-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.voz-estado{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#f3a66a}
.voz-texto{margin:0;font-size:15px;color:#eef2f8;overflow-wrap:anywhere}
.voz-painel .btn{color:#c9d6ea}
.orbe-botao{border:0;background:none;padding:0;cursor:pointer;flex:none}
/* O orbe: três camadas de luz girando, com cor e ritmo diferentes para cada estado */
.orbe{position:relative;display:block;width:76px;height:76px;border-radius:50%;--c1:#4d8ff0;--c2:#38bdf8;--c3:#9cc4ff;--vel:6s;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.9),rgba(255,255,255,0) 32%),radial-gradient(circle,var(--c2) 0%,var(--c1) 55%,rgba(0,0,0,0) 72%);
  box-shadow:0 0 30px var(--c1),0 0 70px -10px var(--c2),inset 0 0 20px rgba(255,255,255,.35);animation:orbeRespira 2.4s ease-in-out infinite}
.orbe i{position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--c3);border-right-color:color-mix(in srgb,var(--c3) 40%,transparent);animation:orbeGira var(--vel) linear infinite;filter:drop-shadow(0 0 6px var(--c3))}
.orbe i:nth-child(2){inset:-12px;animation-duration:calc(var(--vel) * 1.6);animation-direction:reverse;opacity:.7}
.orbe i:nth-child(3){inset:4px;animation-duration:calc(var(--vel) * .7);opacity:.6}
.orbe.pensando{--c1:#d9681a;--c2:#ffb067;--c3:#ffd2a8;--vel:1.4s;animation:orbeRespira 1s ease-in-out infinite}
.orbe.falando{--c1:#1c9e5e;--c2:#5fe0a0;--c3:#bff5d9;--vel:3s}
.orbe.bate{animation:orbeBate .25s ease-out}
@keyframes orbeGira{to{transform:rotate(360deg)}}
@keyframes orbeRespira{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes orbeBate{0%{transform:scale(1.14)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.orbe,.orbe i{animation:none}}

/* ===== Comando de voz (botão fixo e barra) ===== */
.cmd-botao{position:fixed;right:22px;bottom:22px;z-index:4500;width:58px;height:58px;border-radius:50%;border:1px solid rgba(160,190,240,.35);background:radial-gradient(circle at 50% 40%,#1b3560,#0a1527);display:grid;place-items:center;cursor:pointer;box-shadow:0 14px 34px rgba(8,16,32,.4)}
.cmd-botao:hover{transform:translateY(-1px)}
.cmd-botao[hidden]{display:none}
.cmd-botao .orbe.mini{width:28px;height:28px;animation-duration:3.2s}
.cmd-botao .orbe.mini i{inset:-4px}
.cmd-botao .orbe.mini i:nth-child(2){inset:-7px}
.cmd-botao.ligado{border-color:#ff8a3d;box-shadow:0 0 0 4px rgba(217,104,26,.25),0 14px 34px rgba(8,16,32,.4)}
.cmd-barra{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:4600;width:min(720px,calc(100vw - 32px));display:flex;flex-direction:column;gap:10px;animation:cmdEntra .25s cubic-bezier(.2,.8,.2,1)}
.cmd-barra[hidden]{display:none}
@keyframes cmdEntra{from{opacity:0;transform:translate(-50%,14px) scale(.98)}to{opacity:1;transform:translate(-50%,0)}}
.cmd-caixa{display:flex;align-items:center;gap:16px;padding:14px 16px 14px 18px;border-radius:22px;background:rgba(8,17,34,.86);border:1px solid rgba(160,190,240,.28);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 30px 80px rgba(0,0,0,.45),0 0 60px -20px #4d8ff0}
.cmd-caixa .orbe{width:56px;height:56px;flex:none}
.cmd-meio{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.cmd-estado{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#f3a66a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmd-meio input{width:100%;border:0;outline:0;background:transparent;color:#fff;font-size:19px;font-family:var(--f-texto);padding:2px 0}
.cmd-meio input::placeholder{color:#7f93b5}
.cmd-fechar{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.08);color:#c9d6ea;display:grid;place-items:center;cursor:pointer}
.cmd-exemplos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.cmd-exemplos button{padding:7px 12px;border-radius:999px;border:1px solid rgba(160,190,240,.25);background:rgba(8,17,34,.72);color:#c9d6ea;font-size:12.5px;cursor:pointer;backdrop-filter:blur(10px)}
.cmd-exemplos button:hover{color:#fff;border-color:rgba(243,166,106,.6)}
body.apresentando .cmd-botao,body.apresentando .cmd-barra{display:none}
@media (max-width:700px){.cmd-botao{right:14px;bottom:14px;width:52px;height:52px}.cmd-barra{bottom:78px}.cmd-meio input{font-size:16px}.cmd-exemplos{display:none}}

/* ===== Galáxia de soluções (Biblioteca) ===== */
.galaxia{position:relative;height:clamp(320px,46vh,460px);border-radius:20px;overflow:hidden;isolation:isolate;background:radial-gradient(120% 100% at 50% 30%,#141c3d 0%,#080d1f 60%,#05070f 100%);border:1px solid #1c2650;box-shadow:0 20px 50px rgba(8,16,32,.25)}
.galaxia-palco{position:absolute;inset:0}
.galaxia-palco canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
.galaxia-rotulos{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.constelacao{position:absolute;left:0;top:0;font:600 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#aebde0;text-shadow:0 0 12px rgba(120,150,255,.7);white-space:nowrap}
.galaxia-dica{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-radius:12px;background:rgba(10,16,38,.9);border:1px solid rgba(160,190,240,.3);color:#eef2f8;max-width:300px;z-index:3}
.galaxia-dica b{font-size:13.5px}
.galaxia-dica span{font-size:11.5px;color:#a9b9d3}
.galaxia-dica[hidden]{display:none}
.galaxia-legenda{position:absolute;left:14px;bottom:12px;z-index:2;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(8,12,30,.6);border:1px solid rgba(160,190,240,.15);backdrop-filter:blur(8px);font-size:11.5px;color:#c9d6ea;pointer-events:none;max-width:calc(100% - 28px)}
.galaxia-legenda span{display:inline-flex;align-items:center;gap:6px}
.galaxia-legenda i{width:8px;height:8px;border-radius:50%;box-shadow:0 0 8px currentColor}
.galaxia-legenda .gl-nota{color:#8ea2c4}
@media (max-width:600px){.galaxia-legenda .gl-nota{display:none}}

/* ===== Transições entre telas =====
   Só o conteúdo (à direita) troca; a barra lateral fica parada. */
#principal{view-transition-name:principal}
::view-transition-group(principal){animation-duration:.5s}
::view-transition-old(principal),::view-transition-new(principal){mix-blend-mode:normal}
::view-transition-image-pair(principal){isolation:auto}
/* Outra tela: a antiga some com desfoque, a nova sobe */
html.vt-pagina::view-transition-old(principal){animation:vtSai .32s cubic-bezier(.4,0,1,1) both}
html.vt-pagina::view-transition-new(principal){animation:vtEntra .55s cubic-bezier(.2,.8,.2,1) .08s both}
@keyframes vtSai{to{opacity:0;transform:scale(.975);filter:blur(8px)}}
@keyframes vtEntra{from{opacity:0;transform:translateY(18px) scale(1.01);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
/* Aba da mesma empresa ou setor: desliza de leve */
html.vt-aba::view-transition-old(principal){animation:vtAbaSai .2s ease-in both}
html.vt-aba::view-transition-new(principal){animation:vtAbaEntra .32s cubic-bezier(.2,.8,.2,1) both}
@keyframes vtAbaSai{to{opacity:0;transform:translateX(-10px)}}
@keyframes vtAbaEntra{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
/* Entrar na empresa pela ilha: o campo mergulha e a página abre num círculo que nasce da ilha */
html.vt-circulo::view-transition-old(principal){animation:vtMergulho .8s cubic-bezier(.6,0,.4,1) both}
html.vt-circulo::view-transition-new(principal){animation:vtCirculo .8s cubic-bezier(.65,0,.35,1) both}
@keyframes vtMergulho{to{transform:scale(1.25);filter:blur(10px) brightness(1.4);opacity:.2}}
@keyframes vtCirculo{from{clip-path:circle(0 at var(--vt-x,50%) var(--vt-y,50%))}to{clip-path:circle(160vmax at var(--vt-x,50%) var(--vt-y,50%))}}
::view-transition-old(root),::view-transition-new(root){animation:none}
/* Sem transição do navegador: a tela nova só aparece suave */
.miolo.entra-pagina,.miolo.entra-circulo{animation:vtEntra .5s cubic-bezier(.2,.8,.2,1) both}
.miolo.entra-aba{animation:vtAbaEntra .3s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}

/* ===== Plaquinha da ilha em holograma ===== */
.pq{overflow:hidden;background:linear-gradient(160deg,rgba(18,38,72,.82),rgba(8,17,34,.82));border:1px solid rgba(140,200,255,.28);border-top:1px solid color-mix(in srgb,var(--saude) 70%,#fff 0%);box-shadow:0 12px 32px rgba(0,0,0,.4),0 0 26px -8px var(--saude),inset 0 0 22px -10px rgba(120,190,255,.6)}
.pq::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(160,210,255,.05) 0 1px,transparent 1px 3px);border-radius:inherit}
.pq-scan{position:absolute;left:0;right:0;top:-30%;height:30%;pointer-events:none;background:linear-gradient(transparent,rgba(140,210,255,.16),transparent);animation:pqScan 5.5s ease-in-out infinite}
@keyframes pqScan{0%,62%{top:-30%}100%{top:110%}}
.pq-anel{position:relative;flex:none;width:42px;height:42px;display:grid;place-items:center}
.pq-anel svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.pq-anel-fundo{fill:none;stroke:rgba(255,255,255,.12);stroke-width:3.2}
.pq-anel-cor{fill:none;stroke:var(--saude);stroke-width:3.2;stroke-linecap:round;stroke-dasharray:var(--cheio) var(--volta);filter:drop-shadow(0 0 3px var(--saude));animation:pqAnel 1.2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pqAnel{from{stroke-dasharray:0 var(--volta)}}
.pq-anel b{position:relative;font:600 12.5px var(--f-mono);color:#fff}
.pq-eixos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;padding:0 2px}
.pq-eixo{display:flex;align-items:center;gap:4px}
.pq-eixo i{flex:1;height:4px;border-radius:999px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}
.pq-eixo i::after{content:"";position:absolute;left:0;top:0;bottom:0;width:var(--v);border-radius:999px;background:linear-gradient(90deg,#5fb8ff,#9fe7ff);box-shadow:0 0 6px #5fb8ff;animation:pqBarra 1.1s .2s cubic-bezier(.2,.8,.2,1) both}
@keyframes pqBarra{from{width:0}}
.pq-eixo em{font:600 9.5px var(--f-mono);font-style:normal;color:#8ea2c4}
.pq-nota{display:none}
@media (prefers-reduced-motion:reduce){.pq-scan,.pq-anel-cor,.pq-eixo i::after{animation:none}}
/* Números no meio da ponte de dados (aparecem ao passar o mouse na ilha) */
.ponte-rotulo{position:absolute;left:0;top:0;pointer-events:none;display:flex;flex-direction:column;gap:3px;padding:7px 11px;border-radius:12px;background:rgba(8,17,34,.82);border:1px solid rgba(255,170,100,.35);backdrop-filter:blur(10px);white-space:nowrap;font-size:12px;box-shadow:0 0 24px -6px #ff8a3d}
.ponte-rotulo span{display:inline-flex;align-items:center;gap:6px}
.ponte-rotulo .ic svg{width:13px;height:13px}
.pr-ida{color:#ffb98a}.pr-volta{color:#7ff0b3}
/* Cartões com profundidade */
.cartao-setor,.cartao-empresa,.bib-card,.ind{transition:transform .25s ease,box-shadow .25s ease;transform-style:preserve-3d}
.com-tilt.com-tilt{position:relative;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-2px)!important;box-shadow:0 18px 40px -18px rgba(14,26,44,.35)}
.com-tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(320px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.22),transparent 60%);mix-blend-mode:soft-light}

/* Logo no cadastro e no cabeçalho da empresa */
.rotulo-campo{font-weight:600;font-size:13.5px}
.logo-campo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo-previa{width:120px;height:56px;border-radius:10px;border:1px dashed var(--line-2);background:#fff;display:grid;place-items:center;overflow:hidden;color:var(--faint);font-size:12px}
.logo-previa img{max-width:90%;max-height:80%;object-fit:contain}
h1.com-logo{display:flex;align-items:center;gap:14px}
.logo-empresa{height:52px;width:auto;max-width:150px;object-fit:contain;background:#fff;border-radius:12px;padding:6px 8px;border:1px solid var(--line)}

/* Aviso rápido (toast) */
.toast{position:fixed;inset:auto;margin:0;border:0;overflow:visible;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 12px 10px 16px;border-radius:10px;font-weight:500;font-size:14px;z-index:100;max-width:calc(100vw - 32px);box-shadow:var(--sombra-3);display:flex;gap:12px;align-items:center;animation:surgir .18s ease-out}
.toast.erro{background:var(--bad);color:#fff}
.toast button{border:0;background:transparent;color:var(--accent-2);font-weight:700;cursor:pointer;padding:4px 6px;border-radius:6px}
.toast button:hover{background:rgba(255,255,255,.1)}
.esqueleto{height:96px;border-radius:var(--raio);background:linear-gradient(90deg,var(--surface) 0%,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:brilho 1.2s infinite;border:1px solid var(--line)}
@keyframes brilho{to{background-position:-200% 0}}
.so-leitura .so-editor{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---------- RF Sinais ---------- */
.lado-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;box-shadow:0 0 0 3px rgba(217,104,26,.22);animation:pulsoBadge 2.4s ease-in-out infinite}
@keyframes pulsoBadge{50%{box-shadow:0 0 0 6px rgba(217,104,26,.08)}}
@media (prefers-reduced-motion:reduce){.lado-badge{animation:none}}
.sinais-ligar .painel-corpo{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-3) 100%);color:var(--navy-ink);border-radius:inherit}
.sinais-ligar h2{color:#fff}
.sinais-passos{margin:10px 0 16px;padding-left:20px;display:grid;gap:6px;color:var(--navy-ink)}
.sinais-url{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sinais-url input{flex:1 1 280px;min-width:0;padding:10px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font:inherit;font-size:14px}
.sinais-cab{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sinais-links{display:grid;gap:2px;margin-top:10px}
.sinais-link{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.sinais-link:first-child{border-top:0}
.sinais-link .nome{font-weight:600}
.sinais-link .botoes{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.sinais-lista{display:grid;gap:12px;margin:14px 0 22px}
.sinal-card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.sinal-card.gargalo{border-left-color:var(--st-resolvido)}
.sinal-card.arquivado{border-left-color:var(--line-2);opacity:.85}
.sinal-topo{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sinal-nivel{margin-left:auto;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted)}
.sinal-nivel.alto{background:var(--bad-soft);color:var(--bad)}
.sinal-nivel.medio{background:var(--st-execucao-soft);color:var(--st-execucao)}
.sinal-texto{margin:0;font-size:15.5px;line-height:1.5;white-space:pre-wrap}
.sinal-meta{margin:0;display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.sinal-meta span{display:inline-flex;align-items:center;gap:5px}
.sinal-meta .ic svg{width:14px;height:14px}
.sinal-aviso{margin:0;font-size:13px;color:var(--st-execucao)}
.sinal-acoes{display:flex;gap:8px;flex-wrap:wrap}
.como-funciona dl{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:8px 16px;margin:10px 0 0}
.como-funciona dt{font-weight:600}
.como-funciona dd{margin:0;color:var(--muted)}
@media (max-width:600px){.como-funciona dl{grid-template-columns:1fr}.como-funciona dd{margin-bottom:6px}}
/* ---------- Barra lateral recolhível (só no computador) ---------- */
.lado-topo{display:flex;align-items:flex-start;gap:6px}
.lado-topo .marca{flex:1;min-width:0}
.lado-recolher{flex:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--navy-line);background:transparent;color:var(--navy-muted);display:grid;place-items:center;cursor:pointer;margin-top:4px}
.lado-recolher:hover{background:var(--navy-2);color:#fff}
.lado-recolher .ic svg{width:16px;height:16px}
@media (min-width:1001px){
  .app{transition:grid-template-columns .25s ease}
  .app.lado-recolhido{grid-template-columns:76px minmax(0,1fr);background:linear-gradient(to right,var(--navy) 76px,transparent 76px)}
  .app.lado-recolhido .lado{padding-left:12px;padding-right:12px;overflow-x:hidden}
  .app.lado-recolhido .lado-topo{flex-direction:column;align-items:center}
  .app.lado-recolhido .marca .logo{width:46px;aspect-ratio:1/1;background-size:auto 100%;background-position:left center}
  .app.lado-recolhido .marca-sub,.app.lado-recolhido .lado-titulo,.app.lado-recolhido .lado-link .nome,.app.lado-recolhido .lado-nota,.app.lado-recolhido .lado-vazio,.app.lado-recolhido .lado-usuario span:not(.avatar){display:none}
  .app.lado-recolhido .lado-link{justify-content:center;position:relative;padding-left:0;padding-right:0}
  .app.lado-recolhido .lado-badge{position:absolute;top:0;right:2px;min-width:16px;height:16px;font-size:10px;padding:0 4px}
  .app.lado-recolhido .lado-usuario{justify-content:center}
}
@media (max-width:1000px){.lado-recolher{display:none}}
</style>

<div class="app" id="app">

  <div class="lado-fundo" data-acao="fecharMenu"></div>
  <div class="area">
    <header class="barra-movel">
      <button class="icone-btn" data-acao="abrirMenu" aria-label="Abrir menu"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span></button>
      <a class="marca" href="#inicio" aria-label="Real Forte Consultoria, início"><span class="logo" role="img" aria-label="Real Forte Consultoria"></span></a>
    </header>
    <main class="conteudo" id="principal"></main>
  </div>
</div>
